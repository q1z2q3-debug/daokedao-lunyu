<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="公制、分界、私门三段并列，箭头自公向私">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">公 · 邦君之制</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">塞门 · 反坫</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">界 · 大夫之份</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不得僭用</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">私 · 管氏之家</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一一照立</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三归、不摄、塞门、反坫，四事一个方向</text></svg>
