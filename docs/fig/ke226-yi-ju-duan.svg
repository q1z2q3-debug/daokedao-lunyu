<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="断、德、色、诚四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">未见：一断</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">叹</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">好德：当好</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">理</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">如好色：不及</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">诚</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">量的是诚</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">非德</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">量的不是德，是诚</text></svg>
