<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="不伐、奔而殿、策其马、马不进也四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">不伐</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一句定评</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">奔而殿</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其功：居后</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#8A8074">策其馬</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其掩：当着人</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">馬不進也</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其辞：推给马</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">功在人后，辞在人前：掩功不是躲，是当着人掩</text></svg>
