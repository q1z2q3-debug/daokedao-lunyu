<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="文、躬行、言、行四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">文：犹人</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">可与人比</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">躬行：未得</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">只与自己比</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#8A8074">言：可及</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说得</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">行：不及</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">做不得</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">前半句越平实，后半句越沉</text></svg>