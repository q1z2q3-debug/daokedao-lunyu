<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 330" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="serif" role="img" aria-label="义理图二 一个回路">
<text x="200" y="26" text-anchor="middle" font-size="12" fill="#8A8074" letter-spacing="2">示意 · 一条链，把忧卸掉</text><rect x="30" y="56" width="340" height="56" fill="#FFFDF6" stroke="#DCD5C8"/><text x="52" y="82" font-size="14" fill="#2F2A24">父母之心</text><text x="52" y="102" font-size="11.5" fill="#5C5347">无所不至，唯恐其疾</text><rect x="30" y="140" width="340" height="56" fill="#FFFDF6" stroke="#DCD5C8"/><text x="52" y="166" font-size="14" fill="#2F2A24">子以之为心</text><text x="52" y="186" font-size="11.5" fill="#5C5347">知此，则守身自谨</text><rect x="30" y="224" width="340" height="56" fill="#FFFDF6" stroke="#DCD5C8"/><text x="52" y="250" font-size="14" fill="#2F2A24">守身</text><text x="52" y="270" font-size="11.5" fill="#5C5347">作息、行止、不涉险</text><line x1="200" y1="112" x2="200" y2="138" stroke="#A2503B"/><polygon points="200,140 195,133 205,133" fill="#A2503B"/><line x1="200" y1="196" x2="200" y2="222" stroke="#A2503B"/><polygon points="200,224 195,217 205,217" fill="#A2503B"/><rect x="30" y="286" width="340" height="30" fill="#FBF1EC" stroke="#A2503B"/><text x="200" y="306" text-anchor="middle" font-size="12" fill="#A2503B">父母少一忧　—　孝在此处落地</text><line x1="200" y1="280" x2="200" y2="286" stroke="#A2503B"/></svg>
