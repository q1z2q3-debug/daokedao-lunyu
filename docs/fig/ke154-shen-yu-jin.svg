<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="身退与志退两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">老了：身退</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不可怕</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">劲松：志退</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">才可怕</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">老了不可怕，劲松了才可怕</text></svg>
