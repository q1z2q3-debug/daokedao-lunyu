<?xml version="1.0" encoding="UTF-8"?>
<!-- zt5 图一 药与饭：《道德经》第十八章次序 -->
<svg viewBox="0 0 400 300" width="400" height="300" xmlns="http://www.w3.org/2000/svg" font-family="serif"><text x="16" y="22" font-size="11.5" fill="#8A8074" letter-spacing="2">示意 · 药与饭：先有缺口，后有药</text><text x="24" y="50" font-size="10" fill="#8A8074">缺口（无）</text><text x="176" y="50" font-size="10" fill="#8A8074">药（有）</text><rect x="24" y="60" width="118" height="34" fill="#FFFDF6" stroke="#DCD5C8"/><text x="34" y="82" font-size="11" fill="#2F2A24">大道废</text><path d="M148 77 L170 77" stroke="#A2503B"/><path d="M164 72 L170 77 L164 82" fill="none" stroke="#A2503B"/><rect x="176" y="60" width="200" height="34" fill="#FBF1EC" stroke="#DCD5C8"/><text x="186" y="82" font-size="11" fill="#A2503B">有仁义</text><rect x="24" y="102" width="118" height="34" fill="#FFFDF6" stroke="#DCD5C8"/><text x="34" y="124" font-size="11" fill="#2F2A24">慧智出</text><path d="M148 119 L170 119" stroke="#A2503B"/><path d="M164 114 L170 119 L164 124" fill="none" stroke="#A2503B"/><rect x="176" y="102" width="200" height="34" fill="#FBF1EC" stroke="#DCD5C8"/><text x="186" y="124" font-size="11" fill="#A2503B">有大伪</text><rect x="24" y="144" width="118" height="34" fill="#F6F1E3" stroke="#A2503B"/><text x="34" y="166" font-size="11" fill="#2F2A24">六亲不和</text><path d="M148 161 L170 161" stroke="#A2503B"/><path d="M164 156 L170 161 L164 166" fill="none" stroke="#A2503B"/><rect x="176" y="144" width="200" height="34" fill="#FBF1EC" stroke="#A2503B"/><text x="186" y="166" font-size="11" fill="#A2503B">有孝慈</text><rect x="24" y="186" width="118" height="34" fill="#FFFDF6" stroke="#DCD5C8"/><text x="34" y="208" font-size="11" fill="#2F2A24">国家昏乱</text><path d="M148 203 L170 203" stroke="#A2503B"/><path d="M164 198 L170 203 L164 208" fill="none" stroke="#A2503B"/><rect x="176" y="186" width="200" height="34" fill="#FBF1EC" stroke="#DCD5C8"/><text x="186" y="208" font-size="11" fill="#A2503B">有忠臣</text><line x1="16" y1="236" x2="384" y2="236" stroke="#DCD5C8"/><text x="200" y="256" font-size="10.5" fill="#5C5347" text-anchor="middle">药有用，但药不是健康——反的是把药当饭，不反药</text><text x="200" y="276" font-size="9.5" fill="#8A8074" text-anchor="middle">次序不可倒置：不是孝慈造成不和，是不和才需要孝慈</text><text x="200" y="292" font-size="9.5" fill="#8A8074" text-anchor="middle">（据《道可道·第十八章》重绘示意）</text></svg>
