<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="问名实空四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">问：谁好学</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">季康子</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">举名：颜回</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">有顏回者</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">举实：短命</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不幸死矣</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">举空：今亡</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">今也則亡</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是死了，是没有了</text></svg>