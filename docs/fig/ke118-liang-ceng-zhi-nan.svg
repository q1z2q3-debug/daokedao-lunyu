<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="已矣乎、未见、见其过、内自讼四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">已矣乎</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">先叹</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">未见</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">几乎无人</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">见其过</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">第一难</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">内自讼</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">第二难</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">叹辞在前，是因为这判断太重：见其过已难，讼于己更难</text></svg>
