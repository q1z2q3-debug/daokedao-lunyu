<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="三贵与一舍四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">容貌：远暴慢</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">举止先到</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">颜色：近信</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">神色次之</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">辞气：远鄙倍</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">言辞最后</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">笾豆：有司</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一舍</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">临终的人只讲最要紧的</text></svg>
