<text x="230" y="30" text-anchor="middle" font-size="11" fill="#3A342B">一车两轮：学以载之，思以运之</text>
<text x="230" y="288" text-anchor="middle" font-size="11" fill="#5F564A">两轮同轴，缺一车不行；不是谁比谁重要，是谁也离不开谁</text>
