<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="向内与向外两栏对照，左为德刑、右为土惠">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">向内 · 问对不对</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">德与刑</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">向外 · 问多不多</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">土与惠</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">同一个问题，两种问法，长出两种人</text></svg>
