  <text x="340" y="126" text-anchor="middle" font-size="9.5" fill="#8A8074">不足</text>
  <line x1="282" y1="100" x2="306" y2="100" stroke="#A2503B" stroke-width="1.5"/>
  <text x="220" y="170" text-anchor="middle" font-size="10.5" fill="#2F2A24">断在第三、第四环：制度尚在，证据不在</text>
