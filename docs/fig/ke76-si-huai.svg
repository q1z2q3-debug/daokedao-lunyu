<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="德、土、刑、惠四格并列，末为惠">  <rect x="30" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="76" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">君子 · 怀德</text>  <text x="76" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所念在正</text>  <rect x="145" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="191" y="88" text-anchor="middle" font-size="12" fill="#8A8074">小人 · 怀土</text>  <text x="191" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所念在产</text>  <rect x="260" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="306" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">君子 · 怀刑</text>  <text x="306" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所敬在法</text>  <rect x="375" y="56" width="55" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="402" y="88" text-anchor="middle" font-size="12" fill="#A2503B">小人 · 怀惠</text>  <text x="402" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所贪在利</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">四句两对：一对见志向，一对见底线</text></svg>
