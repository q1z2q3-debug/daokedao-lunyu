<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="使仕、未能信、子说三段，末为师喜">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">使仕</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">机会：来了</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">未能信</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">自审：道未信于心</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">子說</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">师喜：喜其不欺</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">命之、辞之、喜之：喜在末，是对「自知」的定价</text></svg>
