<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="三段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#A2503B">逆億</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">无据而疑</text> <rect x="160" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="206" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">先覺</text> <text x="206" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">有征而知</text> <rect x="305" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="351" y="88" text-anchor="middle" font-size="12" fill="#8A8074">純信</text> <text x="351" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不设阱而失察</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">同是「早」，一出于心，一出于事</text></svg>