<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="张与弛两栏"> <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">礼之张：加</text> <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">冠、服、拜、趋</text> <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">礼之弛：减</text> <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不尸、不容</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">该减的时候减下去，礼才立得住</text></svg>
