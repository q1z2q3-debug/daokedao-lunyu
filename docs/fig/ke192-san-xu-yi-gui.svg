<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="问、有、受、友四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">能问不能</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">问之虚</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">有若无</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">有之虚</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">犯而不校</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">受之虚</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">吾友</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一归其人</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三个方向都指向同一件事：不显</text></svg>
