<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="问行果教四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">问：善人之道</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">子张</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">行：不踐迹</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">另开一路</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">果：亦不入室</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">却也难至深</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">教：质美须学</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">未言之意</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不劝，只把代价摆出来</text></svg>