<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="用之则行、舍之则藏、暴虎冯河、临事而惧四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">用之則行</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">外有命</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">舍之則藏</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">己有守</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">暴虎馮河</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">无备之勇</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">臨事而懼</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">有戒之勇</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">戒的不是勇气，是无备的勇气</text></svg>
