<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="急缓敬限四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">公赐：急</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">当日颁</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">家祭：缓</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">三日限</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不留神惠</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">敬</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">过三日：断</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">限</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">礼不只说该做什么，也说该什么时候停</text></svg>
