<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="非生知、好古、敏、求之四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">非生知</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">起点：先破</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">好古</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">方向：所向</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">敏</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">脚力：跑得快</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">求之</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">动作：追上去</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">方向不对跑得快也没用；只有方向不肯跑也到不了</text></svg>