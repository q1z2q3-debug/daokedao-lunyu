<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="燕居、申申如、夭夭如、十六字四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">燕居</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">闲时：最真</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">申申如</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">身：舒展不僵</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">夭夭如</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">色：和悦不冷</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">十六字</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">三孤例</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不写他说什么，只写身与色：修养是可以被看见的</text></svg>
