<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="美与善两轴并列，美同而善异">  <rect x="60" y="56" width="140" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="130" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">美 · 声容</text>  <text x="130" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">两乐皆尽</text>  <rect x="250" y="56" width="140" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="320" y="88" text-anchor="middle" font-size="12" fill="#A2503B">善 · 来路</text>  <text x="320" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">禅尽 · 伐未</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">美可听，善须问：两把尺不是一把</text></svg>
