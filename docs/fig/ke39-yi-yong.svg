<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" role="img" aria-label="义勇相须：知义判断到行义行动到勇站得住，知而不行即为无勇">
    <rect x="20" y="66" width="110" height="64" fill="#FFFDF6" stroke="#4A5C55"/>
    <text x="75" y="94" text-anchor="middle" font-size="13" fill="#2F2A24">知义</text>
    <text x="75" y="114" text-anchor="middle" font-size="10.5" fill="#8A8074">判断</text>
    <path d="M132 98 L160 98" stroke="#5C5347" stroke-width="1.6"/>
    <path d="M160 98 l-6 -2 M160 98 l-3 -6" stroke="#5C5347" stroke-width="1.6" fill="none"/>
    <rect x="165" y="66" width="110" height="64" fill="#FFFDF6" stroke="#4A5C55"/>
    <text x="220" y="94" text-anchor="middle" font-size="13" fill="#2F2A24">行义</text>
    <text x="220" y="114" text-anchor="middle" font-size="10.5" fill="#8A8074">行动</text>
    <path d="M277 98 L305 98" stroke="#5C5347" stroke-width="1.6"/>
    <path d="M305 98 l-6 -2 M305 98 l-3 -6" stroke="#5C5347" stroke-width="1.6" fill="none"/>
    <rect x="310" y="66" width="110" height="64" fill="#FFFDF6" stroke="#4A5C55"/>
    <text x="365" y="94" text-anchor="middle" font-size="13" fill="#2F2A24">勇</text>
    <text x="365" y="114" text-anchor="middle" font-size="10.5" fill="#8A8074">站得住</text>
    <text x="220" y="176" text-anchor="middle" font-size="12" fill="#A2503B">知而不行，本章判为无勇</text>
    <text x="220" y="212" text-anchor="middle" font-size="10.5" fill="#5C5347">无义之勇，是乱是盗（17.21）</text>
  </svg>
