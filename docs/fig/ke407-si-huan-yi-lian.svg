<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">義爲質</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其内</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">禮行之</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其迹</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">孫出之</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其辞</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">信成之</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其终</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">四环一链，缺一即断</text></svg>