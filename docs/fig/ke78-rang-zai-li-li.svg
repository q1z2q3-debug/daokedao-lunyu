<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="礼、让、为国三段递进，末为何有">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">礼 · 节文在外</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">仪节、制度</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">让 · 礼之里</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">先人后己</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">为国 · 何有</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">本立则不难</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">让在先、礼在后；失让，礼只剩动作</text></svg>
