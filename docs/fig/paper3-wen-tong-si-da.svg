<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="同一问孝四答一归">
<text x="220" y="26" text-anchor="middle" font-size="13" fill="#A2503B">同一句「问孝」，四答</text>
<line x1="220" y1="150" x2="56" y2="76" stroke="#C58A73" stroke-width="1"/>
<line x1="220" y1="150" x2="384" y2="76" stroke="#C58A73" stroke-width="1"/>
<line x1="220" y1="150" x2="56" y2="224" stroke="#C58A73" stroke-width="1"/>
<line x1="220" y1="150" x2="384" y2="224" stroke="#C58A73" stroke-width="1"/>
<circle cx="220" cy="150" r="33" fill="#FFFDF6" stroke="#4A5C55" stroke-width="1.5"/>
<text x="220" y="159" text-anchor="middle" font-family="Kaiti SC,STKaiti,serif" font-size="22" fill="#2F2A24">孝</text>
<circle cx="56" cy="76" r="5" fill="#4A5C55"/><circle cx="384" cy="76" r="5" fill="#4A5C55"/>
<circle cx="56" cy="224" r="5" fill="#4A5C55"/><circle cx="384" cy="224" r="5" fill="#4A5C55"/>
<text x="56" y="46" text-anchor="middle" font-size="12" fill="#2F2A24">孟懿子</text>
<text x="384" y="46" text-anchor="middle" font-size="12" fill="#2F2A24">孟武伯</text>
<text x="86" y="98" text-anchor="start" font-size="11" fill="#5C5347">无违：事以礼</text>
<text x="354" y="98" text-anchor="end" font-size="11" fill="#5C5347">唯疾之忧</text>
<text x="56" y="256" text-anchor="middle" font-size="12" fill="#2F2A24">子游</text>
<text x="384" y="256" text-anchor="middle" font-size="12" fill="#2F2A24">子夏</text>
<text x="86" y="204" text-anchor="start" font-size="11" fill="#5C5347">敬：不敬何别</text>
<text x="354" y="204" text-anchor="end" font-size="11" fill="#5C5347">色难</text>
<text x="220" y="284" text-anchor="middle" font-size="11" fill="#8A8074">所归同：孝　　所授异：各对其病</text>
</svg>
