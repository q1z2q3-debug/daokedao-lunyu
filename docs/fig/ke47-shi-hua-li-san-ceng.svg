<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" role="img" aria-label="诗、画、礼三层：素在先，绘在后">
  <rect x="40" y="46" width="360" height="40" fill="#FFFDF6" stroke="#DED2B9"/>
  <text x="58" y="72" font-size="11.5" fill="#2F2A24">诗　有倩盼之质，方有绚烂之文</text>
  <rect x="40" y="104" width="360" height="40" fill="#FFFDF6" stroke="#DED2B9"/>
  <text x="58" y="130" font-size="11.5" fill="#2F2A24">画　有粉素之地，方施五彩</text>
  <rect x="40" y="162" width="360" height="40" fill="#FFFDF6" stroke="#A2503B"/>
  <text x="58" y="188" font-size="11.5" fill="#A2503B">礼　有忠信之质，方行礼文</text>
  <line x1="220" y1="86" x2="220" y2="104" stroke="#4A5C55"/><line x1="220" y1="144" x2="220" y2="162" stroke="#4A5C55"/>
  <text x="220" y="226" text-anchor="middle" font-size="10.5" fill="#8A8074">同一句式，三层递进：礼后乎</text>
</svg>
