<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="雅言、诗书、执礼、皆四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">雅言</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">正音：都听得懂</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">詩與書</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">诵：出声</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">執禮</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">行：有节</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">皆</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一件不例外</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一个「皆」字最重：三件事一件都不例外</text></svg>