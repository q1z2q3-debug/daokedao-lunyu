<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="两栏"> <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="115" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">当面不赞</text> <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不以言悦人</text> <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">背后而赞</text> <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不以人废言</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">赞不苟</text></svg>