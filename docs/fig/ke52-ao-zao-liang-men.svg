<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="奥尊而远，灶近而管事，二者皆非最后依归">
  <rect x="40" y="42" width="150" height="72" fill="#FFFDF6" stroke="#4A5C55"/>
  <text x="115" y="72" text-anchor="middle" font-size="13" fill="#4A5C55">奥 · 位尊而远</text>
  <text x="115" y="96" text-anchor="middle" font-size="10" fill="#8A8074">室隅所尊</text>
  <rect x="250" y="42" width="150" height="72" fill="#FFFDF6" stroke="#A2503B"/>
  <text x="325" y="72" text-anchor="middle" font-size="13" fill="#A2503B">灶 · 位近而管事</text>
  <text x="325" y="96" text-anchor="middle" font-size="10" fill="#8A8074">饮食祸福</text>
  <rect x="170" y="150" width="100" height="42" fill="#FBF7EC" stroke="#4A5C55"/>
  <text x="220" y="176" text-anchor="middle" font-size="12" fill="#4A5C55">天 · 最后依归</text>
  <line x1="115" y1="114" x2="190" y2="150" stroke="#DED2B9"/><line x1="325" y1="114" x2="250" y2="150" stroke="#DED2B9"/>
</svg>