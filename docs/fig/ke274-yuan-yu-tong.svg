<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="向外与向内两栏"> <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">怨天：向外</text> <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">非此章之旨</text> <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">丧予：向内</text> <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">天夺我命</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是怨天，是痛极</text></svg>