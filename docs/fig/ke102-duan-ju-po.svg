<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="刚、欲、焉得刚三段，末为判">  <rect x="30" y="56" width="100" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="80" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">剛</text>  <text x="80" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">无求：不为物屈</text>  <rect x="160" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="210" y="88" text-anchor="middle" font-size="12" fill="#8A8074">慾</text>  <text x="210" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">有求：绳在人手</text>  <rect x="290" y="56" width="100" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="340" y="88" text-anchor="middle" font-size="12" fill="#A2503B">焉得剛</text>  <text x="340" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">判：欲在刚亡</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">断、举、破：破处只用一个「慾」字</text></svg>
