<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">崇德：先事后得</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">德是做出来的</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">修慝：攻己不攻人</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">向内</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">惑起：一朝之忿</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">被一口气牵走</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">惑果：忘身及亲</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">代价极重</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三答皆落在事上</text></svg>