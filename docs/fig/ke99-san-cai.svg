<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="三才并列，下接不知其仁">  <rect x="20" y="56" width="110" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="75" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">由：治賦</text>  <text x="75" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">千乘之國</text>  <rect x="160" y="56" width="110" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="215" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">求：爲宰</text>  <text x="215" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">千室之邑</text>  <rect x="300" y="56" width="110" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="355" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">赤：賓客</text>  <text x="355" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">束帶立朝</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三人三才，各就其位：才皆实，而皆止于才</text></svg>
