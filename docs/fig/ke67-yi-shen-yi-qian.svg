<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="安仁与利仁两境并列，末为久">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">安仁</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">以仁为家，不待外求</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">利仁</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">见其利而向之</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">久</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">利久则安</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一条路上两个刻度：先看见，后住下</text></svg>
