<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">謀道</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其志</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">不謀食</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其序</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">餒在其中</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其常</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">祿在其中</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其常</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两「在其中」，常而非必</text></svg>