<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="天生德、桓魋、如予何、其轻四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">天生德：予</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所恃：不在我</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">桓魋：来</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所遇：在人</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">如予何</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所不惧</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">不骂不求</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其轻</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">所恃在自己之外，所以敢说得那么轻</text></svg>