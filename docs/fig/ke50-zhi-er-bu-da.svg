<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="3.10 不欲观与 3.11 不知也，两种失语方式">
  <rect x="40" y="62" width="150" height="72" fill="#FFFDF6" stroke="#4A5C55"/>
  <text x="115" y="92" text-anchor="middle" font-size="13" fill="#4A5C55">3.10 不欲观</text>
  <text x="115" y="116" text-anchor="middle" font-size="10" fill="#8A8074">观上的失语</text>
  <rect x="250" y="62" width="150" height="72" fill="#FFFDF6" stroke="#A2503B"/>
  <text x="325" y="92" text-anchor="middle" font-size="13" fill="#A2503B">3.11 不知也</text>
  <text x="325" y="116" text-anchor="middle" font-size="10" fill="#8A8074">言上的失语</text>
  <text x="220" y="170" text-anchor="middle" font-size="10.5" fill="#2F2A24">同一件事，两种失语方式</text>
</svg>