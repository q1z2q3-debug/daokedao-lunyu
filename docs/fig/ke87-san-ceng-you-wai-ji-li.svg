<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="言不出、耻、躬不逮三段递进，末为距离">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">言之不出</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不轻说</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">恥</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">以欠为羞</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">躬之不逮</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">嘴与手的距离</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不教人少说，教人别让话跑到手前面</text></svg>
