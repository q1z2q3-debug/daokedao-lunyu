<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="觚、不觚、觚哉、觚哉四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">觚</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其形：上圆下方</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">不觚</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其形已失</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">觚哉</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">反诘：这也叫觚</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">觚哉</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">再敲一遍</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">同一个字用了四遍：敲的是名与实之间那道缝</text></svg>
