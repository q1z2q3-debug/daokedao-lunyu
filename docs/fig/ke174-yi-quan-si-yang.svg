<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="文、行、忠、信四事">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">文：知</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">书上得</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">行：践</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">手上做</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">忠：心</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">里面尽</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">信：言</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">外面守</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">由外入内，再由内出外，一圈合上</text></svg>