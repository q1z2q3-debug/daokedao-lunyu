<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="几谏、志不从、敬不违三段递进，末为心气">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">幾谏</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">轻·软·早</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">志不从</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不加力</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">敬不违·劳不怨</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">脸与心</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三道关：一关在嘴，一关在脸，一关在心</text></svg>
