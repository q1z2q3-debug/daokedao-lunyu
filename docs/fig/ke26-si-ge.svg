<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-label="四格：以故新为横轴、以记解为纵轴，旧能解出新者落在师这一格" style="max-width:520px">
    <defs><marker id="a26c" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#8A8074"/></marker></defs>
    <rect x="58" y="54" width="130" height="72" fill="#FCF8EF" stroke="#E2D8C8" stroke-width="1"/>
    <rect x="212" y="54" width="130" height="72" fill="#fff" stroke="#E9E1D4" stroke-width="1"/>
    <rect x="58" y="154" width="130" height="72" fill="#fff" stroke="#E9E1D4" stroke-width="1"/>
    <rect x="212" y="154" width="130" height="72" fill="#fff" stroke="#E9E1D4" stroke-width="1"/>
    <text x="123" y="84" text-anchor="middle" font-size="13" fill="#8C5E2A">温故知新</text>
    <text x="123" y="103" text-anchor="middle" font-size="11.5" fill="#8C5E2A">＝ 师</text>
    <text x="123" y="118" text-anchor="middle" font-size="8.5" fill="#A8763E">旧的回火，新的有根</text>
    <text x="277" y="88" text-anchor="middle" font-size="12.5" fill="#5F564A">以新证旧</text>
    <text x="277" y="108" text-anchor="middle" font-size="9" fill="#8A8074">今事验古义</text>
    <text x="123" y="188" text-anchor="middle" font-size="12.5" fill="#5F564A">复读机</text>
    <text x="123" y="208" text-anchor="middle" font-size="9" fill="#8A8074">熟而不解</text>
    <text x="277" y="188" text-anchor="middle" font-size="12.5" fill="#5F564A">信息流</text>
    <text x="277" y="208" text-anchor="middle" font-size="9" fill="#8A8074">新而无根</text>
    <path d="M200 46 L200 240" stroke="#8A8074" stroke-width="1.2" fill="none" marker-end="url(#a26c)"/>
    <path d="M48 140 L352 140" stroke="#8A8074" stroke-width="1.2" fill="none" marker-end="url(#a26c)"/>
    <text x="190" y="40" text-anchor="end" font-size="10" fill="#8A8074">解</text>
    <text x="190" y="256" text-anchor="end" font-size="10" fill="#8A8074">记</text>
    <text x="48" y="132" text-anchor="start" font-size="10" fill="#8A8074">故</text>
    <text x="352" y="132" text-anchor="end" font-size="10" fill="#8A8074">新</text>
    <text x="200" y="272" text-anchor="middle" font-size="10.5" fill="#5F564A">只记不解，两头都是死格</text>
  </svg>
