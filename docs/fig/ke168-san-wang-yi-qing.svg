<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="发愤忘食、乐以忘忧、不知老、云尔四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">發憤忘食</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">求：忘了吃</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">樂以忘憂</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">得：忘了愁</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不知老將至</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">忘：忘了老</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">云爾</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">轻轻收住</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三句白话，把圣人还原成一个专心的人</text></svg>