<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="火归问不问四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#A2503B">变：火</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">廄焚</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">归：身</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">子退朝</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">问：人</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">傷人乎</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">不问：马</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不問馬</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">问什么见其心，不问什么更见其心</text></svg>
