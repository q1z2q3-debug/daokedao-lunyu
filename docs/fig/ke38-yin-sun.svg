<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" role="img" aria-label="因加损益推演结构：夏礼、殷礼、周礼相因而损益，继周者虽百世可知">
    <rect x="16" y="72" width="84" height="52" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="58" y="102" text-anchor="middle" font-size="13" fill="#2F2A24">夏礼</text>
    <path d="M100 98 L128 98" stroke="#5C5347" stroke-width="1.6"/>
    <path d="M128 98 l-6 -2 M128 98 l-3 -6" stroke="#5C5347" stroke-width="1.6" fill="none"/>
    <text x="117" y="86" text-anchor="middle" font-size="10" fill="#8A8074">因＋损益</text>
    <rect x="134" y="72" width="84" height="52" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="176" y="102" text-anchor="middle" font-size="13" fill="#2F2A24">殷礼</text>
    <path d="M218 98 L246 98" stroke="#5C5347" stroke-width="1.6"/>
    <path d="M246 98 l-6 -2 M246 98 l-3 -6" stroke="#5C5347" stroke-width="1.6" fill="none"/>
    <text x="235" y="86" text-anchor="middle" font-size="10" fill="#8A8074">因＋损益</text>
    <rect x="252" y="72" width="84" height="52" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="294" y="102" text-anchor="middle" font-size="13" fill="#2F2A24">周礼</text>
    <path d="M336 98 L364 98" stroke="#5C5347" stroke-width="1.6"/>
    <path d="M364 98 l-6 -2 M364 98 l-3 -6" stroke="#5C5347" stroke-width="1.6" fill="none"/>
    <text x="353" y="86" text-anchor="middle" font-size="10" fill="#8A8074">继周者</text>
    <rect x="370" y="72" width="76" height="52" fill="#FFFDF6" stroke="#4A5C55"/>
    <text x="408" y="102" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4A5C55">百世可知</text>
    <text x="230" y="186" text-anchor="middle" font-size="10.5" fill="#5C5347">所因者大体相沿，所损益者节目增减；脉络可推，虽百世可知</text>
  </svg>
