<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="适、莫、义三段并列，前二为拆、末为立">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">适 · 专主</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">偏厚</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">莫 · 不肯</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">偏薄</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">义 · 与比</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">依义而附</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两「无」拆的是成见，一「比」立的是准绳</text></svg>
