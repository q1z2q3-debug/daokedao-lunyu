<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="病药因果四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#A2503B">病：躁</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">多言易许</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">药：訒</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其言也迟</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">因：为之难</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">行不易</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">果：言之訒</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">许得慢</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是慢即仁，是知难则慢</text></svg>