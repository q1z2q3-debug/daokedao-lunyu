<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="偶至与长住两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">偶一为之</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">门都没进</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">长住不移</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">才算会</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">仁不是来一趟，是长住</text></svg>
