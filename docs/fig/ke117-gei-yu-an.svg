<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="给与安两栏，左物右心">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">给人东西</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">解决他的缺</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">让人安心</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">解决他的心</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">请客容易，让客人自在地吃完难</text></svg>
