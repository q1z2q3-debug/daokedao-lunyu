<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" role="img" aria-label="僭礼两案：3.1 僭数为可数之量，3.2 僭位为场景之位，汇合于礼定其分">
    <rect x="40" y="56" width="140" height="58" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="110" y="82" text-anchor="middle" font-size="13" fill="#2F2A24">3.1 僭数</text>
    <text x="110" y="102" text-anchor="middle" font-size="10.5" fill="#8A8074">八佾之量 · 可数</text>
    <rect x="260" y="56" width="140" height="58" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="330" y="82" text-anchor="middle" font-size="13" fill="#2F2A24">3.2 僭位</text>
    <text x="330" y="102" text-anchor="middle" font-size="10.5" fill="#8A8074">场景之位 · 在场者</text>
    <path d="M110 116 L176 158" stroke="#5C5347" stroke-width="1.6"/>
    <path d="M176 158 l-6 -2 M176 158 l-3 -6" stroke="#5C5347" stroke-width="1.6" fill="none"/>
    <path d="M330 116 L264 158" stroke="#5C5347" stroke-width="1.6"/>
    <path d="M264 158 l6 -2 M264 158 l3 -6" stroke="#5C5347" stroke-width="1.6" fill="none"/>
    <rect x="130" y="160" width="180" height="50" fill="#FFFDF6" stroke="#4A5C55"/>
    <text x="220" y="182" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4A5C55">礼定其分</text>
    <text x="220" y="200" text-anchor="middle" font-size="10.5" fill="#5C5347">谁在场，谁主祭</text>
  </svg>
