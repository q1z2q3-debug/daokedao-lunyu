<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="韶、武、评三格并列">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">韶 · 禅让</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">让得天下</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#A2503B">武 · 征伐</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">取得天下</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#8A8074">评 · 未尽善</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">差一层非到底</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两支乐都到顶，来路一让一取</text></svg>
