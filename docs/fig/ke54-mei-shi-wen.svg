<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="每事问到是礼也，问本身合礼">
  <rect x="50" y="66" width="150" height="68" fill="#FFFDF6" stroke="#4A5C55"/>
  <text x="125" y="96" text-anchor="middle" font-size="13" fill="#4A5C55">每事问</text>
  <text x="125" y="118" text-anchor="middle" font-size="10" fill="#8A8074">临事咨禀</text>
  <line x1="200" y1="100" x2="250" y2="100" stroke="#4A5C55" stroke-width="1.5"/>
  <text x="225" y="90" text-anchor="middle" font-size="10" fill="#4A5C55">即</text>
  <rect x="250" y="66" width="140" height="68" fill="#FBF7EC" stroke="#A2503B"/>
  <text x="320" y="96" text-anchor="middle" font-size="13" fill="#A2503B">是礼也</text>
  <text x="320" y="118" text-anchor="middle" font-size="10" fill="#8A8074">问本身合礼</text>
  <text x="220" y="170" text-anchor="middle" font-size="10.5" fill="#2F2A24">敬慎之容，即是事神之礼</text>
</svg>