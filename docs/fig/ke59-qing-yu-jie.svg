<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="情至而节存，中和立于情与节之间">
  <rect x="60" y="56" width="130" height="76" fill="#FFFDF6" stroke="#A2503B"/>
  <text x="125" y="90" text-anchor="middle" font-size="12.5" fill="#A2503B">情 · 至而不过</text>
  <text x="125" y="114" text-anchor="middle" font-size="10" fill="#8A8074">发得出来</text>
  <rect x="250" y="56" width="130" height="76" fill="#FFFDF6" stroke="#4A5C55"/>
  <text x="315" y="90" text-anchor="middle" font-size="12.5" fill="#4A5C55">节 · 存于中</text>
  <text x="315" y="114" text-anchor="middle" font-size="10" fill="#8A8074">收得回去</text>
  <rect x="150" y="156" width="140" height="38" fill="#FBF7EC" stroke="#4A5C55"/>
  <text x="220" y="181" text-anchor="middle" font-size="12" fill="#4A5C55">中和 · 情节之间</text>
  <line x1="125" y1="132" x2="190" y2="156" stroke="#DED2B9"/><line x1="315" y1="132" x2="250" y2="156" stroke="#DED2B9"/>
</svg>