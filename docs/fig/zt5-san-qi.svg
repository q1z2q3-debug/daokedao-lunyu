<?xml version="1.0" encoding="UTF-8"?>
<!-- zt5 图二 三器：留空·使通·有度 -->
<svg viewBox="0 0 400 300" width="400" height="300" xmlns="http://www.w3.org/2000/svg" font-family="serif"><text x="16" y="22" font-size="11.5" fill="#8A8074" letter-spacing="2">示意 · 三器：留空 · 使通 · 有度</text><text x="80" y="48" font-size="10.5" fill="#5C5347" text-anchor="middle">杯（敬）</text><path d="M46 66 L46 150 M114 66 L114 150" stroke="#A2503B"/><path d="M46 150 L114 150" stroke="#A2503B" stroke-width="4"/><line x1="46" y1="112" x2="114" y2="112" stroke="#DCD5C8" stroke-dasharray="3 4"/><text x="80" y="104" font-size="12" fill="#8A8074" text-anchor="middle">空</text><text x="80" y="172" font-size="9.5" fill="#5C5347" text-anchor="middle">底＝养；两壁＝敬</text><text x="80" y="188" font-size="9.5" fill="#8A8074" text-anchor="middle">留空则能盛</text><text x="210" y="48" font-size="10.5" fill="#5C5347" text-anchor="middle">管（继）</text><rect x="160" y="96" width="100" height="34" fill="#FFFDF6" stroke="#A2503B"/><path d="M162 113 L256 113" stroke="#A2503B"/><path d="M248 108 L256 113 L248 118" fill="none" stroke="#A2503B"/><text x="210" y="172" font-size="9.5" fill="#5C5347" text-anchor="middle">壁分五瓣，缺一即漏</text><text x="210" y="188" font-size="9.5" fill="#8A8074" text-anchor="middle">水要过，不留</text><text x="330" y="48" font-size="10.5" fill="#5C5347" text-anchor="middle">闸（顺）</text><rect x="300" y="66" width="60" height="84" fill="#FFFDF6" stroke="#A2503B"/><rect x="300" y="102" width="32" height="8" fill="#A2503B"/><path d="M330 116 L330 144" stroke="#8A8074"/><path d="M325 138 L330 144 L335 138" fill="none" stroke="#8A8074"/><text x="330" y="172" font-size="9.5" fill="#5C5347" text-anchor="middle">可开可关，不是拆墙</text><text x="330" y="188" font-size="9.5" fill="#8A8074" text-anchor="middle">有度则久</text><line x1="16" y1="210" x2="384" y2="210" stroke="#DCD5C8"/><text x="200" y="232" font-size="10.5" fill="#5C5347" text-anchor="middle">敬＝留空而不夺；继＝使通而不塞；顺＝有度而不拆</text><text x="200" y="252" font-size="9.5" fill="#8A8074" text-anchor="middle">养为器底（色），三者为其壁；缺一即漏</text><text x="200" y="276" font-size="9.5" fill="#8A8074" text-anchor="middle">（据空杯·通道模型重绘为示意，非原图）</text></svg>
