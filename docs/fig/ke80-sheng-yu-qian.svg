<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="一、贯、忠恕三段递进，末为两手">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">一 · 一根线</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">可反复用的法</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">贯 · 串起</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">众事由此穿</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">忠恕 · 两手</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">尽己与推己</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是高深之理，是遇到人就能用的一法</text></svg>
