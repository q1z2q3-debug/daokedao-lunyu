<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="两栏"> <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">一时之盛</text> <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">僭其名</text> <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">数世之衰</text> <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">失其实</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一盛一衰，中间是「数」</text></svg>