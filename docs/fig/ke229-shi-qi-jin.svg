<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="人、叹、见、未见四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">其人：颜渊</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">点</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">惜乎：叹</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">见其进：实</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所见</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">未见其止：虚</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">未见</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">末句本是赞语，放在叹后成了惋惜</text></svg>
