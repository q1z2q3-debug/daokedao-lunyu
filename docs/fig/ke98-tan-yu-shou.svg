<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="道不行、其由与、无所取材三段，末为收">  <rect x="30" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="80" y="88" text-anchor="middle" font-size="12" fill="#8A8074">道不行</text>  <text x="80" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一句最沉的叹</text>  <rect x="160" y="56" width="100" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="210" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">其由與</text>  <text x="210" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">叹里带许</text>  <rect x="290" y="56" width="100" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="340" y="88" text-anchor="middle" font-size="12" fill="#A2503B">無所取材</text>  <text x="340" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">许其勇，收其喜</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">叹、许、喜、收：先给极重的话，再给极轻的收</text></svg>
