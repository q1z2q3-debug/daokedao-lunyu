<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="门内位卑与门外判高两栏并列">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">门内 · 位卑</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">封人掌疆</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">门外 · 判高</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一语断天下</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">判词从门外来：位置最低的人，看破最高的事</text></svg>
