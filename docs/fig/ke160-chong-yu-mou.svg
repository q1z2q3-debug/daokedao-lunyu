<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="敢冲与先谋两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">敢冲：不怕</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一步到河里</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">先怕：再谋</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">谋而后成</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">先怕，再谋，后成：三个动作缺一个都不算勇</text></svg>
