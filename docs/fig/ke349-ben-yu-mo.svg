<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">德→言</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">必有</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">言↛德</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不必有</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">仁→勇</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">必有</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">勇↛仁</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不必有</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一「向」之辨</text></svg>