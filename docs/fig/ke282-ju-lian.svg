<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="僭助绝声四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#A2503B">僭：富于周公</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">臣富过君祖</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">助：聚斂附益</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">求也为之</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">绝：非吾徒</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">划出「我们」</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">声：鸣鼓而攻</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">摆到明处</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">最硬的不是骂，是划界</text></svg>