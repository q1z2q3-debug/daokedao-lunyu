<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="甚矣吾衰、久矣、不复梦见周公、周公四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">甚矣吾衰</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">叹身：气先出</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">久矣</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">叹时：拖得长</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不復夢周公</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">叹志：影子没了</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">周公：礼乐</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不是一个人</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">面上说身体，落处却在志：梦是志的影子</text></svg>
