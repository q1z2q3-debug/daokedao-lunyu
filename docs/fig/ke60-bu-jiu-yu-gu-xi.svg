<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="已往止咎为正，姑息纵容为非，两端相对">
  <rect x="40" y="56" width="150" height="100" fill="#FFFDF6" stroke="#4A5C55"/>
  <text x="115" y="92" text-anchor="middle" font-size="12.5" fill="#4A5C55">正 · 已往止咎</text>
  <text x="115" y="116" text-anchor="middle" font-size="10" fill="#8A8074">止于不可改处</text>
  <rect x="250" y="56" width="150" height="100" fill="#FFFDF6" stroke="#A2503B"/>
  <text x="325" y="92" text-anchor="middle" font-size="12.5" fill="#A2503B">非 · 姑息纵容</text>
  <text x="325" y="116" text-anchor="middle" font-size="10" fill="#8A8074">未来之过亦放开</text>
  <text x="220" y="192" text-anchor="middle" font-size="10.5" fill="#2F2A24">既往不咎止于旧账，不替未做之错开免罚</text>
</svg>