<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="可妻、缧绁、非其罪三段，末为判准">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">可妻</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">判断：可托</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">縲絏</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">处境：曾囚</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">非其罪</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">判准：罪不在身</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">先立判断，再摆处境，末以四字翻过来</text></svg>
