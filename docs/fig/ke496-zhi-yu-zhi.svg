<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="三框"> <rect x="40" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="100" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不致</text> <text x="100" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">薄而非礼</text> <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">致而止</text> <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">得其中</text> <rect x="280" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="340" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不止</text> <text x="340" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">伤而非孝</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两端皆非</text></svg>