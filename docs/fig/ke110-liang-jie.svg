<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="忠、清两节并列，末为不许仁">  <rect x="30" y="56" width="95" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="77" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">子文：忠</text>  <text x="77" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">尽己，一节之善</text>  <rect x="160" y="56" width="95" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="207" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">文子：清</text>  <text x="207" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">守己，一节之善</text>  <rect x="290" y="56" width="95" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="337" y="88" text-anchor="middle" font-size="12" fill="#A2503B">未知，焉得仁</text>  <text x="337" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">全体不许</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两人对举，两问同答：对称处正见分界</text></svg>
