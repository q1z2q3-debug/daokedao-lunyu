<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="怪、力、乱、神四事">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">怪：反常</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说了吓人</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">力：逞强</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说了学坏</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">亂：悖常</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说了动心</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">神：难明</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说了迷人</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">四样都有一条线：说了容易把人带偏</text></svg>