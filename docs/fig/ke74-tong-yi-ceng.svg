<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="同层与异层两栏并列，末为未足之断">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">同层 · 可与议</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">谋道之实</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">异层 · 不可议</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所重不同</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">未足 · 非不屑</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">是可惜</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是骂他，是不再与他商量：商量要在同一层上</text></svg>
