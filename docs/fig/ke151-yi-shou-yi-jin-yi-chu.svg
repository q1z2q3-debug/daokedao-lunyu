<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="默识、学不厌、诲不倦、何有四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">默而識之</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">受：记进来</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">學而不厭</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">进：往里走</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">誨人不倦</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">出：往外给</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">何有於我</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">自问：做到几分</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">受、进、出都齐了，才谈得上「述」</text></svg>
