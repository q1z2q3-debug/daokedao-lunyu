<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="居蔡、饰以庙制、反问三段">  <rect x="30" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="80" y="88" text-anchor="middle" font-size="12" fill="#8A8074">居蔡</text>  <text x="80" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">为龟作室</text>  <rect x="160" y="56" width="100" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="210" y="88" text-anchor="middle" font-size="12" fill="#A2503B">山節藻梲</text>  <text x="210" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">以庙饰饰之</text>  <rect x="290" y="56" width="100" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="340" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">何如其知</text>  <text x="340" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">反问：算智吗</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">反问比断语更冷：判断留给听的人</text></svg>
