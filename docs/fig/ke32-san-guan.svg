<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" role="img" aria-label="三关：2.15转、2.16立、2.17清">
    <text x="80" y="52" text-anchor="middle" font-size="10" fill="#8A8074">关一</text>
    <text x="220" y="52" text-anchor="middle" font-size="10" fill="#8A8074">关二</text>
    <text x="360" y="52" text-anchor="middle" font-size="10" fill="#8A8074">关三</text>
    <rect x="26" y="66" width="108" height="64" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="80" y="92" text-anchor="middle" font-size="11" fill="#8A8074">2.15 学与思</text>
    <text x="80" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#A2503B">转</text>
    <rect x="166" y="66" width="108" height="64" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="220" y="92" text-anchor="middle" font-size="11" fill="#8A8074">2.16 攻异端</text>
    <text x="220" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#A2503B">立</text>
    <rect x="306" y="66" width="108" height="64" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="360" y="92" text-anchor="middle" font-size="11" fill="#8A8074">2.17 守界</text>
    <text x="360" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#A2503B">清</text>
    <path d="M136 98 L164 98" stroke="#5C5347" stroke-width="2"/>
    <path d="M164 98 l-6 -3.5 M164 98 l-6 3.5" stroke="#5C5347" stroke-width="2" fill="none"/>
    <path d="M276 98 L304 98" stroke="#5C5347" stroke-width="2"/>
    <path d="M304 98 l-6 -3.5 M304 98 l-6 3.5" stroke="#5C5347" stroke-width="2" fill="none"/>
    <text x="220" y="176" text-anchor="middle" font-size="11.5" fill="#2F2A24">转要有个端，端要有个界</text>
    <text x="220" y="200" text-anchor="middle" font-size="10.5" fill="#8A8074">不动则无端，无端则无界可划；界不清，则端是假的</text>
    <text x="220" y="226" text-anchor="middle" font-size="10.5" fill="#5C5347">三关都过，学才有骨头</text>
  </svg>
