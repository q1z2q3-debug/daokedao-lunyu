<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="述、不作、信而好古、比老彭四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">述</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">传旧：讲下去</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">不作</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不另立一套</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">信而好古</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">信从且喜爱</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">比老彭</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">自处：放得低</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三句一层进一层：做什么、为什么、把自己放在哪</text></svg>
