<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="喜与惧两栏并置，左庆右忧">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">喜 · 多一岁</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">寿可庆</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">惧 · 少一岁</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">衰可忧</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是先后，是同时；孝在这里不是行为，是心事</text></svg>
