<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" role="img" aria-label="礼之失效两面：僭越是位不对而用，空转是人不在而文存，二者皆礼之失效">
    <rect x="40" y="56" width="150" height="58" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="115" y="82" text-anchor="middle" font-size="13" fill="#2F2A24">僭越：位不对而用</text>
    <text x="115" y="102" text-anchor="middle" font-size="10.5" fill="#8A8074">3.1 八佾舞庭 · 3.2 以雍彻</text>
    <rect x="250" y="56" width="150" height="58" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="325" y="82" text-anchor="middle" font-size="13" fill="#2F2A24">空转：人不在而文存</text>
    <text x="325" y="102" text-anchor="middle" font-size="10.5" fill="#8A8074">3.3 人而不仁</text>
    <path d="M115 116 L182 158" stroke="#5C5347" stroke-width="1.6"/>
    <path d="M182 158 l-6 -2 M182 158 l-3 -6" stroke="#5C5347" stroke-width="1.6" fill="none"/>
    <path d="M325 116 L258 158" stroke="#5C5347" stroke-width="1.6"/>
    <path d="M258 158 l6 -2 M258 158 l3 -6" stroke="#5C5347" stroke-width="1.6" fill="none"/>
    <rect x="150" y="160" width="140" height="50" fill="#FFFDF6" stroke="#4A5C55"/>
    <text x="220" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#4A5C55">礼之失效</text>
    <text x="220" y="232" text-anchor="middle" font-size="10.5" fill="#5C5347">位不对，或人不在；同一诊断的两面</text>
  </svg>
