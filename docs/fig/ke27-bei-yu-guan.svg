<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-label="杯与管：杯有底盛一用，管两端皆通" style="max-width:520px">
    <path d="M96 112 L152 112 L140 196 L108 196 Z" fill="#FCF8EF" stroke="#C9BEAE" stroke-width="1.2"/>
    <line x1="100" y1="128" x2="148" y2="128" stroke="#D8CBB4" stroke-width="1"/>
    <text x="124" y="94" text-anchor="middle" font-size="11" fill="#8C5E2A">器</text>
    <text x="124" y="168" text-anchor="middle" font-size="13" fill="#3A342B">一用</text>
    <text x="124" y="216" text-anchor="middle" font-size="9" fill="#8A8074">有底有壁，盛一样</text>
    <ellipse cx="280" cy="112" rx="30" ry="9" fill="none" stroke="#A8763E" stroke-width="1.2"/>
    <ellipse cx="280" cy="196" rx="30" ry="9" fill="none" stroke="#A8763E" stroke-width="1.2"/>
    <line x1="250" y1="112" x2="250" y2="196" stroke="#A8763E" stroke-width="1.2"/>
    <line x1="310" y1="112" x2="310" y2="196" stroke="#A8763E" stroke-width="1.2"/>
    <defs><marker id="a27a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#A8763E"/></marker></defs>
    <path d="M280 92 L280 216" stroke="#A8763E" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#a27a)"/>
    <text x="280" y="94" text-anchor="middle" font-size="11" fill="#8C5E2A">不器</text>
    <text x="280" y="150" text-anchor="middle" font-size="12" fill="#3A342B">通</text>
    <text x="280" y="216" text-anchor="middle" font-size="9" fill="#8A8074">两端皆通，用周</text>
    <text x="200" y="248" text-anchor="middle" font-size="11" fill="#5F564A">杯有底，管无底：可器而不着于器</text>
  </svg>
