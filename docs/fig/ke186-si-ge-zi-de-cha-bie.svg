<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="坦荡、戚戚、求己、求人四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">君子：坦蕩蕩</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">有主故平</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">小人：長戚戚</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">无主故忧</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">求諸己：坦</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">向内</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">求諸人：戚</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">向外</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">差的不在境遇，在有没有一个落处</text></svg>