<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="指名似憾其实其心四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">指名：回</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">德行科之首</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">似憾：非助我</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">无以为益</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#8A8074">其实：无所不说</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一概领受</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">其心：深喜</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">似憾实喜</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">恨其不疑，正是喜其无疑</text></svg>