<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" role="img" aria-label="断句两读对照：甲读孝乎惟孝叹词顿开，乙读四字连读">
    <text x="34" y="44" font-size="11" fill="#4A5C55">甲 · 本课所取</text>
    <rect x="30" y="54" width="380" height="60" fill="#FFFDF6" stroke="#4A5C55"/>
    <text x="220" y="90" text-anchor="middle" font-size="13" fill="#2F2A24">孝乎！惟孝，友于兄弟，施于有政。</text>
    <text x="34" y="150" font-size="11" fill="#8A8074">乙 · 连读并存</text>
    <rect x="30" y="160" width="380" height="60" fill="#FFFDF6" stroke="#DED2B9"/>
    <text x="220" y="196" text-anchor="middle" font-size="13" fill="#5C5347">孝乎惟孝，友于兄弟，施于有政。</text>
    <text x="220" y="240" text-anchor="middle" font-size="10.5" fill="#5C5347">叹词一顿，惟孝领起下文；由家及政</text>
  </svg>
