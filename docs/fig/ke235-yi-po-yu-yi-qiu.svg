<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="贫、富、不耻三层"> <rect x="40" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="100" y="88" text-anchor="middle" font-size="12" fill="#8A8074">衣敝縕</text> <text x="100" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">贫</text> <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">衣狐貉</text> <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">富</text> <rect x="280" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="340" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">立而不恥</text> <text x="340" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其由也与</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">并立而不自降</text></svg>