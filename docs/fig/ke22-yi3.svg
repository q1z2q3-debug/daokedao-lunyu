<svg viewBox="0 0 400 380" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="serif" role="img" aria-label="义理图三 「养」的两层 · 「敬」的三向">
<text x="16" y="22" font-size="11.5" fill="#8A8074" letter-spacing="2">示意 · 养的两层（《孟子·离娄下》）</text><rect x="24" y="38" width="352" height="50" fill="#FFFDF6" stroke="#DCD5C8"/><text x="40" y="61" font-size="13.5" fill="#2F2A24">口体</text><text x="88" y="60" font-size="11" fill="#5C5347">酒肉、汤药、护工——钱能办到</text><text x="368" y="60" font-size="10" fill="#8A8074" text-anchor="end">可外包</text><text x="40" y="78" font-size="10.5" fill="#8A8074">身不饥寒，是养的下限</text><rect x="24" y="96" width="352" height="50" fill="#FBF1EC" stroke="#A2503B"/><text x="40" y="119" font-size="13.5" fill="#A2503B">志</text><text x="88" y="118" font-size="11" fill="#5C5347">他还能做主、还被当人——只有你能</text><text x="368" y="118" font-size="10" fill="#A2503B" text-anchor="end">不可外包</text><text x="40" y="136" font-size="10.5" fill="#8A8074">承顺其志而不忍伤之，是养的上限</text><text x="200" y="168" font-size="10.5" fill="#8A8074" text-anchor="middle">孟子断语：「此所谓养口体者也」「若曾子，可谓养志也」</text><text x="16" y="198" font-size="11.5" fill="#8A8074" letter-spacing="2">示意 · 敬的三向（《子路》13.19）</text><rect x="16" y="212" width="113" height="58" fill="#FFFDF6" stroke="#DCD5C8"/><text x="72.5" y="237" font-size="14" fill="#2F2A24" text-anchor="middle">对事</text><text x="72.5" y="258" font-size="10.5" fill="#5C5347" text-anchor="middle">执事敬</text><rect x="143" y="212" width="113" height="58" fill="#FFFDF6" stroke="#DCD5C8"/><text x="199.5" y="237" font-size="14" fill="#2F2A24" text-anchor="middle">对人</text><text x="199.5" y="258" font-size="10.5" fill="#5C5347" text-anchor="middle">与人忠</text><rect x="270" y="212" width="113" height="58" fill="#FFFDF6" stroke="#DCD5C8"/><text x="326.5" y="237" font-size="14" fill="#2F2A24" text-anchor="middle">对己</text><text x="326.5" y="258" font-size="10.5" fill="#5C5347" text-anchor="middle">居处恭</text><text x="200" y="296" font-size="10.5" fill="#8A8074" text-anchor="middle">同一副敬，三个落处：事、人、己</text><line x1="16" y1="308" x2="384" y2="308" stroke="#DCD5C8"/><text x="200" y="332" font-size="14" fill="#A2503B" text-anchor="middle">敬：不敢当他是随便的</text><text x="200" y="356" font-size="10.5" fill="#8A8074" text-anchor="middle">《释名》：「敬，警也，恒自肃警也。」</text></svg>
