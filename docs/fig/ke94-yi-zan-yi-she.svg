<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="赞、设、反证三段，末为反证">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">君子哉若人</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">赞：已成德</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">魯無君子者</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">设：若无人</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">斯焉取斯</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">反证：必有</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">以「无」设问，以「有」作结：一句赞人，一句赞乡</text></svg>
