<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="釜、庾、五秉、周急不继富四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">與之釜</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">六斗四升</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">與之庾</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">十六斗</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">冉子五秉</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">八十斛：擅加</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">周急不繼富</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">全章断语</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一釜、一庾是给，五秉是过：给多不等于给对</text></svg>
