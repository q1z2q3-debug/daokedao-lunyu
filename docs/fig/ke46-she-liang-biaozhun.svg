<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240" role="img" aria-label="射的两套标准：中与容体，力与贯革">
  <rect x="40" y="50" width="160" height="70" fill="#FFFDF6" stroke="#4A5C55"/>
  <text x="120" y="78" text-anchor="middle" font-size="13" fill="#4A5C55">礼射</text>
  <text x="120" y="100" text-anchor="middle" font-size="10.5" fill="#8A8074">中 · 容体 · 揖让</text>
  <rect x="240" y="50" width="160" height="70" fill="#FFFDF6" stroke="#A2503B"/>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="#A2503B">角力</text>
  <text x="320" y="100" text-anchor="middle" font-size="10.5" fill="#8A8074">贯革 · 力 · 胜负</text>
  <text x="220" y="152" text-anchor="middle" font-size="11" fill="#2F2A24">标准一换，射就退出礼，进入斗</text>
  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#8A8074">为力不同科，故不以力衡人</text>
</svg>
