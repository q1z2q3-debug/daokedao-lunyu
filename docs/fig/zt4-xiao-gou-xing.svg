<?xml version="1.0" encoding="UTF-8"?>
<!-- zt4 图一 孝之构形：老下子承，合为一字 -->
<svg viewBox="0 0 400 250" width="400" height="250" xmlns="http://www.w3.org/2000/svg" font-family="serif"><text x="16" y="22" font-size="12.5" fill="#8A8074" letter-spacing="2">示意 · 「孝」的构形：一个承字</text><rect x="30" y="40" width="150" height="140" fill="#FFFDF6" stroke="#DCD5C8"/><text x="105" y="78" font-size="15" fill="#A2503B" text-anchor="middle">老（省）</text><text x="105" y="104" font-size="11.5" fill="#5C5347" text-anchor="middle">长发、佝偻、倚杖</text><text x="105" y="128" font-size="11.5" fill="#8A8074" text-anchor="middle">＝ 所受者</text><line x1="80" y1="140" x2="130" y2="140" stroke="#DCD5C8"/><text x="105" y="162" font-size="11.5" fill="#5C5347" text-anchor="middle">上一代</text><text x="200" y="112" font-size="20" fill="#A2503B" text-anchor="middle">承</text><path d="M178 128 L222 128" stroke="#A2503B"/><path d="M214 122 L222 128 L214 134" fill="none" stroke="#A2503B"/><rect x="250" y="40" width="120" height="140" fill="#FFFDF6" stroke="#DCD5C8"/><text x="310" y="78" font-size="15" fill="#2F2A24" text-anchor="middle">子</text><text x="310" y="104" font-size="11.5" fill="#5C5347" text-anchor="middle">在下、向上托</text><text x="310" y="128" font-size="11.5" fill="#8A8074" text-anchor="middle">＝ 所承者</text><line x1="280" y1="140" x2="340" y2="140" stroke="#DCD5C8"/><text x="310" y="162" font-size="11.5" fill="#5C5347" text-anchor="middle">下一代</text><text x="200" y="208" font-size="12.5" fill="#5C5347" text-anchor="middle">《说文》「从老省，从子，子承老也」</text><text x="200" y="230" font-size="11.5" fill="#8A8074" text-anchor="middle">段注：此「说会意之恉」——画的不是动作，是关系</text></svg>
