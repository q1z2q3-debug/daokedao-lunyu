<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="富贵贫贱四格并列，末为守仁">  <rect x="30" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="76" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">富 · 贵</text>  <text x="76" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所欲；不以其道不处</text>  <rect x="145" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="191" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">贫 · 贱</text>  <text x="191" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所恶；不以其道不去</text>  <rect x="260" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="306" y="88" text-anchor="middle" font-size="12" fill="#8A8074">去仁</text>  <text x="306" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">名无所附</text>  <rect x="375" y="56" width="55" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="402" y="88" text-anchor="middle" font-size="12" fill="#A2503B">守仁</text>  <text x="402" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">终食不违</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">四处一界，界外无名；末格是那个「必于是」</text></svg>
