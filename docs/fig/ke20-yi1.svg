<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 480" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="serif" role="img" aria-label="义理图一 无违的两读">
<text x="200" y="26" text-anchor="middle" font-size="12" fill="#8A8074" letter-spacing="2">示意 · 两个字，两种判据</text>
<rect x="30" y="44" width="340" height="46" fill="#FBF1EC" stroke="#A2503B"/>
<text x="200" y="74" text-anchor="middle" font-size="15" fill="#2F2A24">「无违」违的是什么</text>
<line x1="200" y1="90" x2="200" y2="108" stroke="#C6B8A2"/>
<line x1="110" y1="108" x2="290" y2="108" stroke="#C6B8A2"/>
<line x1="110" y1="108" x2="110" y2="126" stroke="#C6B8A2"/>
<line x1="290" y1="108" x2="290" y2="126" stroke="#C6B8A2"/>
<rect x="30" y="126" width="160" height="132" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="110" y="154" text-anchor="middle" font-size="14" fill="#5C5347">不违亲意</text>
<text x="110" y="180" text-anchor="middle" font-size="12" fill="#8A8074">判据：父亲</text>
<text x="110" y="206" text-anchor="middle" font-size="12" fill="#5C5347">父说则做</text>
<text x="110" y="232" text-anchor="middle" font-size="12" fill="#8A8074">方向：顺从</text>
<rect x="210" y="126" width="160" height="132" fill="#FBF1EC" stroke="#A2503B"/>
<text x="290" y="154" text-anchor="middle" font-size="14" fill="#A2503B">不背于理</text>
<text x="290" y="180" text-anchor="middle" font-size="12" fill="#8A8074">判据：礼</text>
<text x="290" y="206" text-anchor="middle" font-size="12" fill="#5C5347">合礼则行</text>
<text x="290" y="232" text-anchor="middle" font-size="12" fill="#8A8074">方向：守正</text>
<line x1="150" y1="286" x2="250" y2="286" stroke="#A2503B"/>
<polygon points="252,286 242,281 242,291" fill="#A2503B"/>
<rect x="30" y="306" width="340" height="106" fill="#FFFDF6" stroke="#A2503B"/>
<text x="200" y="332" text-anchor="middle" font-size="12.5" fill="#2F2A24">朱子：「恐其失指，</text>
<text x="200" y="352" text-anchor="middle" font-size="12.5" fill="#2F2A24">而以从亲之令为孝。」</text>
<text x="200" y="384" text-anchor="middle" font-size="12.5" fill="#A2503B">注家的断语，落在右边</text>
<text x="200" y="446" text-anchor="middle" font-size="11.5" fill="#8A8074">一读把判据交给父亲，一读把判据交给礼</text>
</svg>
