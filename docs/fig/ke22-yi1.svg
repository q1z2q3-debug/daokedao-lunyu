<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="serif" role="img" aria-label="义理图一 一条线，把人分出来">
<text x="16" y="24" font-size="11.5" fill="#8A8074" letter-spacing="2">示意 · 一条线，把人分出来</text><rect x="16" y="40" width="164" height="176" fill="#FFFDF6" stroke="#DCD5C8"/><text x="98" y="72" text-anchor="middle" font-size="17" fill="#2F2A24">养</text><text x="98" y="100" text-anchor="middle" font-size="11.5" fill="#5C5347">饮食供奉 · 给食给居</text><text x="98" y="126" text-anchor="middle" font-size="11.5" fill="#5C5347">人畜犬马，亦能有养</text><text x="98" y="158" text-anchor="middle" font-size="11.5" fill="#8A8074">可替代：钱能办到</text><text x="98" y="196" text-anchor="middle" font-size="10.5" fill="#8A8074">此层止于「不饿」</text><rect x="220" y="40" width="164" height="176" fill="#FBF1EC" stroke="#A2503B"/><text x="302" y="72" text-anchor="middle" font-size="17" fill="#A2503B">敬</text><text x="302" y="100" text-anchor="middle" font-size="11.5" fill="#5C5347">尊敬而不敢忽忘</text><text x="302" y="126" text-anchor="middle" font-size="11.5" fill="#5C5347">视为人，不视为畜</text><text x="302" y="158" text-anchor="middle" font-size="11.5" fill="#A2503B">不可替代：只有你能看见</text><text x="302" y="196" text-anchor="middle" font-size="10.5" fill="#8A8074">此层起于「被看见」</text><line x1="200" y1="30" x2="200" y2="226" stroke="#A2503B" stroke-dasharray="4 4"/><rect x="180" y="112" width="40" height="26" fill="#FBF1EC" stroke="#A2503B"/><text x="200" y="131" text-anchor="middle" font-size="14" fill="#A2503B">别</text><text x="200" y="256" text-anchor="middle" font-size="11.5" fill="#8A8074">不敬，则与养犬马者何异——朱子语</text></svg>
