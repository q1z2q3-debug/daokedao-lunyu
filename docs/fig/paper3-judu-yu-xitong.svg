<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="440" height="250" role="img" aria-label="学之一端与教之多端">
<line x1="220" y1="18" x2="220" y2="232" stroke="#DED2B9" stroke-dasharray="3 4"/>
<text x="28" y="28" font-size="14" font-weight="600" fill="#A2503B">学：一端自限</text>
<line x1="110" y1="52" x2="110" y2="122" stroke="#4A5C55" stroke-width="2.5"/>
<line x1="110" y1="172" x2="110" y2="210" stroke="#4A5C55" stroke-width="2.5"/>
<text x="96" y="150" text-anchor="end" font-size="10.5" fill="#A2503B">干断</text>
<line x1="110" y1="100" x2="172" y2="192" stroke="#5C5347" stroke-width="2"/>
<circle cx="176" cy="195" r="5" fill="#A2503B"/>
<text x="176" y="214" text-anchor="middle" font-size="10.5" fill="#8A8074">专治一端</text>
<text x="250" y="28" font-size="14" font-weight="600" fill="#A2503B">教：多端定位</text>
<line x1="330" y1="52" x2="330" y2="210" stroke="#4A5C55" stroke-width="2.5"/>
<line x1="330" y1="88" x2="396" y2="70" stroke="#5C5347"/><circle cx="399" cy="69" r="4" fill="#4A5C55"/>
<line x1="330" y1="140" x2="396" y2="140" stroke="#5C5347"/><circle cx="399" cy="140" r="4" fill="#4A5C55"/>
<line x1="330" y1="192" x2="396" y2="200" stroke="#5C5347"/><circle cx="399" cy="201" r="4" fill="#4A5C55"/>
<text x="330" y="232" text-anchor="middle" font-size="10.5" fill="#8A8074">枝各得位，干不折</text>
<text x="220" y="256" text-anchor="middle" font-size="11.5" fill="#5C5347">同一判准：问归处，不问名单</text>
</svg>
