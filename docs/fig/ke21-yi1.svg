<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 372" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="serif" role="img" aria-label="义理图一 两读分流">
<text x="200" y="26" text-anchor="middle" font-size="12" fill="#8A8074" letter-spacing="2">示意 · 八个字，两条读法</text><rect x="70" y="44" width="260" height="44" fill="#FBF1EC" stroke="#A2503B"/><text x="200" y="72" text-anchor="middle" font-size="14" fill="#A2503B">唯其疾之忧</text><line x1="200" y1="88" x2="200" y2="104" stroke="#C6B8A2"/><line x1="110" y1="104" x2="290" y2="104" stroke="#C6B8A2"/><line x1="110" y1="104" x2="110" y2="120" stroke="#C6B8A2"/><line x1="290" y1="104" x2="290" y2="120" stroke="#C6B8A2"/><rect x="30" y="120" width="160" height="126" fill="#FFFDF6" stroke="#DCD5C8"/><text x="110" y="150" text-anchor="middle" font-size="13" fill="#2F2A24">父母忧子之疾</text><text x="110" y="176" text-anchor="middle" font-size="11.5" fill="#8A8074">其＝子</text><text x="110" y="206" text-anchor="middle" font-size="11.5" fill="#5C5347">孝＝谨身，不使忧</text><rect x="210" y="120" width="160" height="126" fill="#FFFDF6" stroke="#DCD5C8"/><text x="290" y="150" text-anchor="middle" font-size="13" fill="#2F2A24">子忧父母之疾</text><text x="290" y="176" text-anchor="middle" font-size="11.5" fill="#8A8074">其＝父母</text><text x="290" y="206" text-anchor="middle" font-size="11.5" fill="#5C5347">孝＝侍疾，致其忧</text><rect x="30" y="266" width="340" height="72" fill="#FFFDF6" stroke="#DCD5C8"/><text x="200" y="292" text-anchor="middle" font-size="12" fill="#5C5347">朱子主左，末句兼右：</text><text x="200" y="316" text-anchor="middle" font-size="12" fill="#A2503B">先受父母之心，再以父母之心为心</text></svg>
