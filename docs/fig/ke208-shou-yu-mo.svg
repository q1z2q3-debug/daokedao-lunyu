<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="首与末两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">首句：一断</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">禹吾无间</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">末句：复句以收</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">同一断语</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是又说一遍，是把三件事收进一个断语</text></svg>
