<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="四格：知与不知乘以承认为知与否">
    <line x1="55" y1="160" x2="385" y2="160" stroke="#4A5C55" stroke-width="2"/>
    <line x1="220" y1="72" x2="220" y2="252" stroke="#4A5C55" stroke-width="2"/>
    <text x="52" y="178" font-size="10.5" fill="#8A8074">实际：不知</text>
    <text x="388" y="178" font-size="10.5" fill="#8A8074" text-anchor="end">实际：知</text>
    <text x="234" y="66" font-size="10.5" fill="#8A8074">自称：知</text>
    <text x="234" y="272" font-size="10.5" fill="#8A8074">自称：不知</text>
    <circle cx="145" cy="112" r="6.5" fill="#A2503B"/>
    <text x="158" y="92" font-size="13" font-weight="600" fill="#A2503B">自欺</text>
    <text x="158" y="108" font-size="10" fill="#8A8074">不知称知</text>
    <circle cx="295" cy="112" r="6.5" fill="#4A5C55"/>
    <text x="308" y="92" font-size="13" font-weight="600" fill="#2F2A24">知之</text>
    <text x="308" y="108" font-size="10" fill="#8A8074">知而称知</text>
    <circle cx="140" cy="228" r="6.5" fill="#7C8B6F"/>
    <text x="153" y="203" font-size="12" font-weight="600" fill="#4A5C55">不知为不知</text>
    <text x="153" y="219" font-size="10" fill="#8A8074">是知也</text>
    <circle cx="295" cy="228" r="6.5" fill="#C58A73"/>
    <text x="308" y="203" font-size="13" font-weight="600" fill="#8A6A4E">藏</text>
    <text x="308" y="219" font-size="10" fill="#8A8074">知而称不知</text>
    <text x="220" y="292" text-anchor="middle" font-size="10.5" fill="#5C5347">判准不在知道多少，在承不承认</text>
  </svg>
