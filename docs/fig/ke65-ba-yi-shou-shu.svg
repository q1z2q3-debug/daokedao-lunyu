<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="八佾四段收束线，末格为心">  <rect x="30" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="76" y="88" text-anchor="middle" font-size="12" fill="#8A8074">僭 · 数位</text>  <text x="76" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">季氏八佾</text>  <rect x="145" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="191" y="88" text-anchor="middle" font-size="12" fill="#8A8074">本 · 哀戚</text>  <text x="191" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">林放问礼</text>  <rect x="260" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="306" y="88" text-anchor="middle" font-size="12" fill="#8A8074">序 · 乐</text>  <text x="306" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">翕纯皦绎</text>  <rect x="375" y="56" width="55" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="402" y="88" text-anchor="middle" font-size="12" fill="#A2503B">心 · 三不</text>  <text x="402" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">收篇</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">八佾由外而内：僭、本、序，终于一心</text></svg>
