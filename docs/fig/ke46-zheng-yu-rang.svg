<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="争在射之胜负，让在揖让升降；两端同属一场射礼">
  <rect x="40" y="46" width="150" height="74" fill="#FFFDF6" stroke="#A2503B"/>
  <text x="115" y="78" text-anchor="middle" font-size="13" fill="#A2503B">争 · 射之胜负</text>
  <text x="115" y="102" text-anchor="middle" font-size="10" fill="#8A8074">相射而定高下</text>
  <rect x="250" y="46" width="150" height="74" fill="#FFFDF6" stroke="#4A5C55"/>
  <text x="325" y="78" text-anchor="middle" font-size="13" fill="#4A5C55">让 · 揖让升降</text>
  <text x="325" y="102" text-anchor="middle" font-size="10" fill="#8A8074">节次不失</text>
  <rect x="160" y="152" width="120" height="40" fill="#FBF7EC" stroke="#4A5C55"/>
  <text x="220" y="178" text-anchor="middle" font-size="12" fill="#4A5C55">同属一场射礼</text>
  <line x1="115" y1="120" x2="190" y2="152" stroke="#DED2B9"/><line x1="325" y1="120" x2="250" y2="152" stroke="#DED2B9"/>
</svg>