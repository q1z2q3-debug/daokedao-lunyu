<svg viewBox="0 0 400 500" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="serif" role="img" aria-label="附论五 从甲骨到病床：疾与孝的两次转身">
      <text x="16" y="20" font-size="11.5" fill="#8A8074" letter-spacing="2">示意 · 一条线的两次下沉</text>
      <line x1="15" y1="50" x2="395" y2="50" stroke="#DCD5C8"/>
      <text x="75" y="34" text-anchor="middle" font-size="12" fill="#2F2A24">商 · 甲骨</text>
      <text x="75" y="46" text-anchor="middle" font-size="10" fill="#8A8074">前1300—前1046</text>
      <text x="205" y="34" text-anchor="middle" font-size="12" fill="#2F2A24">西周 · 金文</text>
      <text x="205" y="46" text-anchor="middle" font-size="10" fill="#8A8074">前1046—前771</text>
      <text x="335" y="34" text-anchor="middle" font-size="12" fill="#2F2A24">春秋 · 论语</text>
      <text x="335" y="46" text-anchor="middle" font-size="10" fill="#8A8074">前551—前479</text>
      <text x="15" y="72" font-size="11.5" fill="#A2503B" letter-spacing="1">疾　取象与归处</text>
      <rect x="15" y="82" width="120" height="94" fill="#FFFDF6" stroke="#DCD5C8"/>
      <text x="25" y="104" font-size="11" fill="#2F2A24">从大从矢</text>
      <text x="25" y="124" font-size="11" fill="#5C5347">腋下中箭 · 兵伤</text>
      <text x="25" y="144" font-size="11" fill="#2F2A24">疒：卧床汗出</text>
      <text x="25" y="164" font-size="11" fill="#5C5347">因 · 状　两系</text>
      <rect x="145" y="82" width="120" height="94" fill="#FFFDF6" stroke="#DCD5C8"/>
      <text x="155" y="104" font-size="11" fill="#2F2A24">疒作偏旁</text>
      <text x="155" y="124" font-size="11" fill="#5C5347">金文疾字罕</text>
      <text x="155" y="144" font-size="11" fill="#5C5347">病字后起</text>
      <rect x="275" y="82" width="120" height="94" fill="#FBF1EC" stroke="#A2503B"/>
      <text x="285" y="104" font-size="11" fill="#2F2A24">日常身疾</text>
      <text x="285" y="124" font-size="11" fill="#5C5347">初起 · 可治</text>
      <text x="285" y="144" font-size="11" fill="#A2503B">父母之忧（2.6）</text>
      <text x="15" y="206" font-size="11.5" fill="#4A5C55" letter-spacing="1">孝　从祭到生</text>
      <rect x="15" y="216" width="120" height="94" fill="#FFFDF6" stroke="#DCD5C8"/>
      <text x="25" y="238" font-size="11" fill="#2F2A24">字形未定解</text>
      <text x="25" y="258" font-size="11" fill="#5C5347">子承老 / 顶谷</text>
      <text x="25" y="278" font-size="11" fill="#5C5347">孝卣 · 商晚期</text>
      <rect x="145" y="216" width="120" height="94" fill="#FFFDF6" stroke="#DCD5C8"/>
      <text x="155" y="238" font-size="11" fill="#2F2A24">追孝 · 享孝</text>
      <text x="155" y="258" font-size="11" fill="#5C5347">修宗庙 敬祀事</text>
      <text x="155" y="278" font-size="11" fill="#5C5347">对象：祖考</text>
      <rect x="275" y="216" width="120" height="94" fill="#F0F3F1" stroke="#4A5C55"/>
      <text x="285" y="238" font-size="11" fill="#2F2A24">事生 · 体心</text>
      <text x="285" y="258" font-size="11" fill="#5C5347">养 / 敬 / 色 / 心</text>
      <text x="285" y="278" font-size="11" fill="#4A5C55">床前（2.6）</text>
      <line x1="15" y1="334" x2="395" y2="334" stroke="#DCD5C8"/>
      <rect x="95" y="350" width="210" height="56" fill="#FBF1EC" stroke="#A2503B"/>
      <text x="200" y="374" text-anchor="middle" font-size="12.5" fill="#A2503B">两条线的交点：病床前</text>
      <text x="200" y="394" text-anchor="middle" font-size="11" fill="#5C5347">疾不再是祟，孝不再是祭</text>
      <line x1="75" y1="304" x2="150" y2="348" stroke="#DED2B9"/>
      <line x1="335" y1="304" x2="250" y2="348" stroke="#DED2B9"/>
      <text x="15" y="434" font-size="11" fill="#5C5347">疾从矢，取「因」：外来之伤。</text>
      <text x="15" y="454" font-size="11" fill="#5C5347">疒从床，取「状」：内在之耗。病＝疾加。</text>
      <text x="15" y="476" font-size="11" fill="#A2503B">疾：祟 → 伤 → 身。　孝：祭 → 追孝 → 事生。</text>
    </svg>
