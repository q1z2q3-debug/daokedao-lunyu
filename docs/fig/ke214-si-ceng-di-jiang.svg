<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="疑、抬、压、断四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">太宰：以艺量人</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">疑</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">子贡：天纵</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">抬</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">夫子：少贱</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">压</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">不多也</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一断</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">愈答愈实：会得多是境遇，不是境界</text></svg>
