<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="旧说与本文两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">权变：离经</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">汉儒旧说</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">称锤：合经</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">程子本文</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">权不是离开经，是把经称得合宜</text></svg>
