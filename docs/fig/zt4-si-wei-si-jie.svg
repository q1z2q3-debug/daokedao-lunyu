<?xml version="1.0" encoding="UTF-8"?>
<!-- zt4 图三 四维与四界：养敬顺继／不及越位表演断裂 -->
<svg viewBox="0 0 400 330" width="400" height="330" xmlns="http://www.w3.org/2000/svg" font-family="serif"><text x="16" y="22" font-size="12.5" fill="#8A8074" letter-spacing="2">示意 · 四维与四界</text><text x="200" y="48" font-size="11.5" fill="#8A8074" text-anchor="middle">四条边界：不及 · 越位 · 表演 · 断裂</text><rect x="20" y="60" width="360" height="26" fill="#FBF1EC" stroke="#DCD5C8"/><text x="34" y="78" font-size="12" fill="#A2503B">不及</text><text x="92" y="78" font-size="11.5" fill="#5C5347">有心而力不到，或力到而心不在</text><rect x="20" y="94" width="360" height="26" fill="#FFFDF6" stroke="#DCD5C8"/><text x="34" y="112" font-size="12" fill="#A2503B">越位</text><text x="92" y="112" font-size="11.5" fill="#5C5347">代他做主、代他记忆、代他决定</text><rect x="20" y="128" width="360" height="26" fill="#FBF1EC" stroke="#DCD5C8"/><text x="34" y="146" font-size="12" fill="#A2503B">表演</text><text x="92" y="146" font-size="11.5" fill="#5C5347">做给人看，做完无人受用</text><rect x="20" y="162" width="360" height="26" fill="#FFFDF6" stroke="#DCD5C8"/><text x="34" y="180" font-size="12" fill="#A2503B">断裂</text><text x="92" y="180" font-size="11.5" fill="#5C5347">关系不再往来，只剩名分</text><line x1="20" y1="200" x2="380" y2="200" stroke="#DCD5C8"/><text x="200" y="220" font-size="12" fill="#2F2A24" text-anchor="middle">四维（承的四样东西）</text><rect x="20" y="230" width="86" height="54" fill="#FFFDF6" stroke="#A2503B"/><text x="53" y="252" font-size="12" fill="#A2503B" text-anchor="middle">养</text><text x="53" y="270" font-size="11" fill="#8A8074" text-anchor="middle">承其口体</text><rect x="111" y="230" width="86" height="54" fill="#FFFDF6" stroke="#A2503B"/><text x="154" y="252" font-size="12" fill="#A2503B" text-anchor="middle">敬</text><text x="154" y="270" font-size="11" fill="#8A8074" text-anchor="middle">承其主体</text><rect x="202" y="230" width="86" height="54" fill="#FFFDF6" stroke="#A2503B"/><text x="241" y="252" font-size="12" fill="#A2503B" text-anchor="middle">顺</text><text x="241" y="270" font-size="11" fill="#8A8074" text-anchor="middle">承其志</text><rect x="293" y="230" width="86" height="54" fill="#FFFDF6" stroke="#A2503B"/><text x="336" y="252" font-size="12" fill="#A2503B" text-anchor="middle">继</text><text x="336" y="270" font-size="11" fill="#8A8074" text-anchor="middle">承其业</text><text x="200" y="306" font-size="11" fill="#8A8074" text-anchor="middle">四维皆有失效条件；失效不是「做少了」，是「过界」</text><text x="200" y="322" font-size="11" fill="#8A8074" text-anchor="middle">2.7「不敬何以别乎」是四维的枢轴</text></svg>
