<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="朝中三层"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">朝</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">处</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">下大夫 · 侃侃</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">刚直</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">上大夫 · 誾誾</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">和悦而诤</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">君在 · 踧踖</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">敬而不安</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">位有高下，貌有分寸</text></svg>