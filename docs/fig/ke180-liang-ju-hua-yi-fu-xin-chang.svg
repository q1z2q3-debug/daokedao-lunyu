<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="答、实、指、认四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">知禮：答</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">为国讳</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不知禮：实</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">同姓而娶</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">人必知之：指</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">他人之口</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">丘也幸：认</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">自己之心</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">替人掩一句是礼，认自己一句也是礼</text></svg>