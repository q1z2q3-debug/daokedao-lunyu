<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="示、慎、今、免四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">啟予足／手</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">示其全</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">戰戰兢兢</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一生之慎</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">而今而後</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">此前不敢言</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">吾知免夫</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一句结账</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一个人的谨慎，到死才结账</text></svg>
