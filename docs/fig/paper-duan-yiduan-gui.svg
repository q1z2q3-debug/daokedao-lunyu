<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="端、异端、归三层">
<rect x="96" y="26" width="322" height="54" fill="#FFFDF6" stroke="#DED2B9"/>
<rect x="96" y="112" width="322" height="54" fill="#FFFDF6" stroke="#DED2B9"/>
<rect x="96" y="198" width="322" height="54" fill="#FFFDF6" stroke="#DED2B9"/>
<text x="34" y="60" text-anchor="middle" font-family="Kaiti SC","STKaiti",serif font-size="19" fill="#2F2A24">端</text>
<text x="34" y="146" text-anchor="middle" font-family="Noto Serif SC","Songti SC",serif font-size="13" fill="#A2503B">异端</text>
<text x="34" y="232" text-anchor="middle" font-family="Kaiti SC","STKaiti",serif font-size="19" fill="#2F2A24">归</text>
<text x="108" y="48" font-family="Noto Serif SC","Songti SC",serif font-size="12.5" fill="#2F2A24">一线之头：己之所立</text>
<text x="108" y="68" font-family="Noto Serif SC","Songti SC",serif font-size="11.5" fill="#8A8074">先叩两端（9.8），而后有端（2.16）</text>
<text x="108" y="134" font-family="Noto Serif SC","Songti SC",serif font-size="12.5" fill="#2F2A24">另一头：可观、可较、可采其长</text>
<text x="108" y="154" font-family="Noto Serif SC","Songti SC",serif font-size="11.5" fill="#8A8074">不可为其业——「致远恐泥」（19.4）</text>
<text x="108" y="220" font-family="Noto Serif SC","Songti SC",serif font-size="12.5" fill="#2F2A24">向何处聚：判准在归，不在名单</text>
<text x="108" y="240" font-family="Noto Serif SC","Songti SC",serif font-size="11.5" fill="#8A8074">1.9 归厚　12.1 归仁　20.1 归心</text>
<line x1="256" y1="82" x2="256" y2="108" stroke="#5C5347" marker-end="url(#ar2)"/>
<line x1="256" y1="168" x2="256" y2="194" stroke="#5C5347" marker-end="url(#ar2)"/>
<defs><marker id="ar2" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5C5347"/></marker></defs>
<text x="96" y="282" font-family="Noto Serif SC","Songti SC",serif font-size="11.5" fill="#A2503B">「统」为注家语，全书零见；译回经文，即此「归」字</text>
</svg>
