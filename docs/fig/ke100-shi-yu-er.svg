<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="十与二对照，末为两称弗如">  <rect x="30" y="56" width="100" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="80" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">聞一知十</text>  <text x="80" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">回：举一反十</text>  <rect x="160" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="210" y="88" text-anchor="middle" font-size="12" fill="#8A8074">聞一知二</text>  <text x="210" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">賜：所及有限</text>  <rect x="290" y="56" width="100" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="340" y="88" text-anchor="middle" font-size="12" fill="#A2503B">弗如也</text>  <text x="340" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">两称：一断一许</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">同一句说两遍：第一遍是断，第二遍是许</text></svg>
