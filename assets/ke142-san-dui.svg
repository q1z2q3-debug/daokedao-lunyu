<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="乐水、乐山、动静、乐寿四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">樂水</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所好：动</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">樂山</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所好：静</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">動／靜</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所性</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">樂／壽</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所得</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三对并排，不评高下：说的是两种人的样子</text></svg>
