<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="厄散怕属四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">厄：畏於匡</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">受困</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">散：顏淵後</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">失散</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">怕：以女为死</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一句后怕</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">属：回何敢死</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">身有所属</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">前两层是事，后两层是心</text></svg>