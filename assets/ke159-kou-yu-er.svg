<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="食与声两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">食不甘味</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">口：7.9</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">声不出乐</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">耳：7.10</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一食一声，都是「余哀未尽」的节</text></svg>
