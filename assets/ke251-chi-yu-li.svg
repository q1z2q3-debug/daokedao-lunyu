<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="齿与礼两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">齿：所尊</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">外</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">礼：所守</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">内</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">尊老不是一句话，是一次起身的次序</text></svg>
