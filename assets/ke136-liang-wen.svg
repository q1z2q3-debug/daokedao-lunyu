<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="出必由户、人不走道、何莫、斯道四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">出必由戶</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">常识：无例外</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">人不走道</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">世相：偏要翻墙</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#8A8074">何莫</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">问：为什么都不</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">斯道</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">答：没说</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一句立常识，一句见世相：答案孔子没说</text></svg>
