<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="敏、好学、下问三段，末为气量">  <rect x="30" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="80" y="88" text-anchor="middle" font-size="12" fill="#8A8074">敏</text>  <text x="80" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">才：疾速</text>  <rect x="160" y="56" width="100" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="210" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">好學</text>  <text x="210" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">肯：不倦</text>  <rect x="290" y="56" width="100" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="340" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不恥下問</text>  <text x="340" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">气量：问于下</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三事其实一件：聪明人最不肯向不如自己的人学</text></svg>
