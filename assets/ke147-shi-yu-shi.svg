<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="子见南子、子路不悦、夫子矢之、天厌之四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">子見南子</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其事：难言</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">子路不說</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其疑：藏不住</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">夫子矢之</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其誓：以己担保</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">天厭之兩遍</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说不下去</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不辩解、不斥子路，只发誓：孔子最像人的一刻</text></svg>
