<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="好仁、恶不仁、一日用力三段并列，末为肯">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">好仁 · 无以加之</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">心中占满</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">恶不仁 · 不使加身</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">身上守住</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">一日用力</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">肯与不肯</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">前两层是心与身，末一层才是那一天的力气</text></svg>
