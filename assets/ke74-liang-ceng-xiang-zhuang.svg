<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="志道与耻衣食两栏并列，上者道、下者身">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">志于道 · 心向上</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所立在道</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">耻恶衣食 · 身向下</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">所耻在身</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两层一撞，真假自见：不是不能穿旧衣，是不能以此为耻</text></svg>
