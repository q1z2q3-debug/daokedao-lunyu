<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="质胜文、文胜质、文质彬彬、然后君子四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">質勝文</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">质多：野</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">文勝質</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">文多：史</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">文質彬彬</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">相称：正解</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">然後君子</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">成人：结果</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">病不在质也不在文，在「胜」：一边压过一边，人就歪了</text></svg>
