<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="博施济众、必也圣乎、己欲立而立人、近取譬四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">博施濟衆</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">大问：可谓仁乎</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">必也聖乎</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">抬到圣</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">己欲立而立人</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">落到身上</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">近取譬</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">仁之方</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">大问题，小入手：末句给的是方法，不是定义</text></svg>
