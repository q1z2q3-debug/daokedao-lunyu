<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="有道显才、无道藏才、知可及、愚不可及四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">邦有道·知</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">显：用其才</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">邦无道·愚</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">藏：晦其才</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">知可及</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">才可学</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">愚不可及</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">度难学</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一显一藏，一可及一不可及：叹的不是愚，是分寸</text></svg>
