<svg viewBox="0 0 400 420" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="serif" role="img" aria-label="义理图二 礼＝理的节文">
<text x="200" y="26" text-anchor="middle" font-size="12" fill="#8A8074" letter-spacing="2">示意 · 礼不是外加的规矩</text>
<rect x="30" y="56" width="340" height="86" fill="#FFFDF6" stroke="#DCD5C8"/>
<text x="52" y="90" font-size="16" fill="#2F2A24">理</text>
<text x="52" y="116" font-size="12" fill="#5C5347">这件事本来该怎样</text>
<text x="352" y="90" text-anchor="end" font-size="11" fill="#8A8074">所以然 · 不可见</text>
<rect x="30" y="158" width="340" height="86" fill="#FBF1EC" stroke="#DCD5C8"/>
<text x="52" y="192" font-size="16" fill="#A2503B">节文</text>
<text x="52" y="218" font-size="12" fill="#5C5347">切成可见的度数：几步、几次、几分、几时</text>
<text x="352" y="192" text-anchor="end" font-size="11" fill="#8A8074">分寸 · 刻痕</text>
<line x1="200" y1="142" x2="200" y2="156" stroke="#A2503B"/>
<polygon points="200,156 195,148 205,148" fill="#A2503B"/>
<rect x="30" y="260" width="340" height="86" fill="#FFFDF6" stroke="#DCD5C8"/>
<text x="52" y="294" font-size="16" fill="#2F2A24">仪节</text>
<text x="52" y="320" font-size="12" fill="#5C5347">度数落成动作：跪、拜、哭、献</text>
<text x="352" y="294" text-anchor="end" font-size="11" fill="#8A8074">可见 · 可学</text>
<line x1="200" y1="244" x2="200" y2="258" stroke="#A2503B"/>
<polygon points="200,258 195,250 205,250" fill="#A2503B"/>
<text x="200" y="382" text-anchor="middle" font-size="12" fill="#4A5C55">「不背于理」与「不违礼」，是一件事的两面</text>
</svg>
