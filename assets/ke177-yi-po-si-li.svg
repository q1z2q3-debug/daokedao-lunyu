<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="破、守、路、位四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">不知而作：病</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">他人</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">我無是：守</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">自己</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">多聞多見：路</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">耳与眼</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">知之次：位</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">老实</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">破得干脆，立得具体，收得老实</text></svg>