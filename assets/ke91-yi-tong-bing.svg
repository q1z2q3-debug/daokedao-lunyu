<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="数、君辱、友疏三段递进，末为两果">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#A2503B">數</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">频，过量好意</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">君 · 辱</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">觉得你逼他</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#8A8074">友 · 疏</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">觉得你管他</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">病因同，病灶异：一处毛病，两种后果</text></svg>
