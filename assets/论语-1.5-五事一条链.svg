<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="五事一条链：敬信节爱时" font-family="'Noto Serif SC','Songti SC',serif">
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans SC',sans-serif" letter-spacing="3">义 理 图 一</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">五事一条链</text>
<text x="20" y="78" font-size="12" fill="#6E6459">前一环不立，后一环即空文。</text>

<rect x="20" y="98" width="340" height="68" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="34" y="124" font-size="12" fill="#A2503B">一</text>
<text x="58" y="124" font-size="14" fill="#2F2A24">敬事</text>
<text x="344" y="124" font-size="10.5" fill="#A2503B" text-anchor="end" font-family="'Noto Sans SC',sans-serif">不欺</text>
<text x="58" y="150" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">心在一事上，不他向</text>

<line x1="190" y1="172" x2="190" y2="182" stroke="#C9B79A" stroke-width="1"/>
<path d="M186 178 L190 186 L194 178" stroke="#C9B79A" stroke-width="1.2" fill="none"/>

<rect x="20" y="192" width="340" height="68" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="34" y="218" font-size="12" fill="#A2503B">二</text>
<text x="58" y="218" font-size="14" fill="#2F2A24">信</text>
<text x="344" y="218" font-size="10.5" fill="#A2503B" text-anchor="end" font-family="'Noto Sans SC',sans-serif">不欺</text>
<text x="58" y="244" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">政令必践，赏罚必当</text>

<line x1="190" y1="266" x2="190" y2="276" stroke="#C9B79A" stroke-width="1"/>
<path d="M186 272 L190 280 L194 272" stroke="#C9B79A" stroke-width="1.2" fill="none"/>

<rect x="20" y="286" width="340" height="68" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="34" y="312" font-size="12" fill="#4A5C55">三</text>
<text x="58" y="312" font-size="14" fill="#2F2A24">节用</text>
<text x="344" y="312" font-size="10.5" fill="#4A5C55" text-anchor="end" font-family="'Noto Sans SC',sans-serif">不竭</text>
<text x="58" y="338" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">不伤财：该用则用，不启其端</text>

<line x1="190" y1="360" x2="190" y2="370" stroke="#C9B79A" stroke-width="1"/>
<path d="M186 366 L190 374 L194 366" stroke="#C9B79A" stroke-width="1.2" fill="none"/>

<rect x="20" y="380" width="340" height="68" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="34" y="406" font-size="12" fill="#4A5C55">四</text>
<text x="58" y="406" font-size="14" fill="#2F2A24">爱人</text>
<text x="344" y="406" font-size="10.5" fill="#4A5C55" text-anchor="end" font-family="'Noto Sans SC',sans-serif">不竭</text>
<text x="58" y="432" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">不害民：能不害，已是爱</text>

<line x1="190" y1="454" x2="190" y2="464" stroke="#C9B79A" stroke-width="1"/>
<path d="M186 460 L190 468 L194 460" stroke="#C9B79A" stroke-width="1.2" fill="none"/>

<rect x="20" y="474" width="340" height="44" fill="#FBF6EA" stroke="#CDB99C"/>
<text x="34" y="496" font-size="12" fill="#8A8074">五</text>
<text x="58" y="496" font-size="14" fill="#2F2A24">使民以时</text>
<text x="344" y="496" font-size="10.5" fill="#8A8074" text-anchor="end" font-family="'Noto Sans SC',sans-serif">节律</text>
<text x="58" y="514" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">不夺其时：该征则征，农隙才征</text>
</svg>
