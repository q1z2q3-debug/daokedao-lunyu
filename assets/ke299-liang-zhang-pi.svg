<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="偏叹理譬四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#A2503B">偏：质而已矣</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">质胜文则野</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">叹：驷不及舌</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">言出难追</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">理：文质相须</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一事两面</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">譬：鞟</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">去文则质隐</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一步比一步具体</text></svg>