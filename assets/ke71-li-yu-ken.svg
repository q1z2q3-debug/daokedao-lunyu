<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="力不足与不肯用两栏对照，左虚右实">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">力不足</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">孔子未见过此人</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不肯用</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">遍地都是此人</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是力气不够，是这一天没人肯拿出来</text></svg>
