<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="两两对照四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">回：庶几</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">近于道</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">回：屢空</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">常常空乏</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">賜：不受命</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不安本分</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">賜：億則屢中</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">猜得准</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">近道者未必得福，能中者未必是道</text></svg>