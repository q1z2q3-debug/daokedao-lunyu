<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="位、声、用三段递进">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">位 · 可失</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">失位失国</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">声 · 不失</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">为木铎</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">用 · 在言</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">警众施教</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">位可以丢，声不可以停：用不在位而在言</text></svg>
