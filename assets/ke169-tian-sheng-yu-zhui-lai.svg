<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="生知与学知两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">生知：天生</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">无</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">学知：追来</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">有</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">孔子把自己从「天生」里摘出来了</text></svg>