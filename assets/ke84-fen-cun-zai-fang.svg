<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="远、久、方三段递进，末为心安">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">远</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">距离</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">久</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">消息</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">方</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">心安</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">真正要紧的不是远近，是知不知道你在哪儿</text></svg>
