<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="薄礼与无诲两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">礼：一束干肉</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">低到几乎没有</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">教：未尝无诲</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">高到没有例外</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">礼压到最低，教却不肯少一分</text></svg>
