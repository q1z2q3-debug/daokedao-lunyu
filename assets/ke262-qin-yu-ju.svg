<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="身与心两栏">  <rect x="20" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="80" y="88" text-anchor="middle" font-size="12" fill="#8A8074">寢：不尸</text>  <text x="80" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">身不肆</text>  <rect x="230" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="290" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">居：不容</text>  <text x="290" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">心不假</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">松而不散，自在而不表演</text></svg>
