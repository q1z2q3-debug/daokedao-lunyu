<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="去止叹去四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#A2503B">见色：去</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">色斯擧矣</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">审择：止</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">翔而後集</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">得时：叹</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">時哉時哉</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">再：去</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">三嗅而作</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">见几而作，翔而后集</text></svg>
