<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="立尺、立志、立界三格递进">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">4.3 · 立尺</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">好恶有公</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">4.4 · 立志</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">心有所之</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">4.5 · 立界</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">富贵贫贱以道</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三章一线：尺、志、界，皆由内立</text></svg>
