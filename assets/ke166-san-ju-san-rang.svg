<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="加数年、五十学易、无大过、非求圣四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">加我數年</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">请时：借几年</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">五十學易</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">定课：一部书</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">無大過</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">求果：只求少错</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">非求圣</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">低而高</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">求的只是「不犯大错」，却要拿几年去换</text></svg>