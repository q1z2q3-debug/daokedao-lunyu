<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="不远游与有方两栏对照，左限右通">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">不远游</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不久去、不无消息</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">游必有方</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">去处明白</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">上句是限，下句是通；只读上句，就成了禁足</text></svg>
