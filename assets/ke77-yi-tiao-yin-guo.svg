<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="放、行、多怨三段递进，末为果">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">放于利</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">立准</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">而行</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">贯彻</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">多怨</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">人怨·自怨</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">九字一条因果：准一立，行必至，怨必生</text></svg>
