<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="辩与认两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">辨：我没答错</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">越辩越硬</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">认：我确有过</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">越认越软</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">被说中了，先别急着解释</text></svg>