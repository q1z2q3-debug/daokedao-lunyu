<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="志、疑、答、反问四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">欲居：志</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">去</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">或曰：陋</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">疑</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">君子居之</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">答</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">何陋之有</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">反问收</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">地点不必换，换的是住在那里的人</text></svg>
