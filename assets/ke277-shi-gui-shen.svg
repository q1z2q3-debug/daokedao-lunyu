<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="两问两答四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">问远：事鬼神</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">子路一问</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">拉回：先事人</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">眼前</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#8A8074">再问远：死</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">子路二问</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">再拉回：知生</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">此生</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是不给答案，是不许绕过眼前</text></svg>