<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="两喻并列，末为改法">  <rect x="30" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="80" y="88" text-anchor="middle" font-size="12" fill="#8A8074">朽木不可雕</text>  <text x="80" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">质已坏</text>  <rect x="160" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="210" y="88" text-anchor="middle" font-size="12" fill="#8A8074">糞土之牆</text>  <text x="210" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不可杇</text>  <rect x="290" y="56" width="100" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="340" y="88" text-anchor="middle" font-size="12" fill="#A2503B">於予與改是</text>  <text x="340" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">改一法</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">前半责一人，后半改一法：分量在后半</text></svg>
