<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="宽、敬、哀三处并列，各标其心">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">居上 · 宽</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">待下之厚</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">为礼 · 敬</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">行礼之诚</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">临丧 · 哀</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">临丧之情</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">三处各缺一心，剩下只有形式</text></svg>
