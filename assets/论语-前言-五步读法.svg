<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="五步读法：字、境、义、疑、用" font-family="'Noto Serif SC','Songti SC',serif">
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans SC',sans-serif" letter-spacing="3">读 法 图</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">五步读法</text>
<text x="20" y="78" font-size="12" fill="#6E6459">从字到用，一步不减；减一步，读到的就不是这一章。</text>

<rect x="20" y="100" width="340" height="66" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="38" y="126" font-size="13" fill="#A2503B">一　校字</text>
<text x="38" y="150" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">底本、异文、音读；先弄清它写的是哪个字</text>

<rect x="20" y="178" width="340" height="66" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="38" y="204" font-size="13" fill="#A2503B">二　还境</text>
<text x="38" y="228" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">制度、称谓、场景；字回到它当时的用法</text>

<rect x="20" y="256" width="340" height="66" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="38" y="282" font-size="13" fill="#A2503B">三　立义</text>
<text x="38" y="306" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">义理须超出时代，否则只是史料</text>

<rect x="20" y="334" width="340" height="66" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="38" y="360" font-size="13" fill="#4A5C55">四　存疑</text>
<text x="38" y="384" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">说不清的写出来，不装作都懂</text>

<rect x="20" y="412" width="340" height="66" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="38" y="438" font-size="13" fill="#4A5C55">五　致用</text>
<text x="38" y="462" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">在自己的世代里做出来，才叫习</text>

<line x1="20" y1="498" x2="360" y2="498" stroke="#DCCBB0" stroke-width="1"/>
<text x="20" y="522" font-size="11" fill="#2F2A24">前三步求其真，后两步求其活。</text>
</svg>
