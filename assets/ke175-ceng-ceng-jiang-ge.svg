<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="圣人、君子、善人、有恒四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">聖人：不见</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">高不可及</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">君子：可见</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">降一格</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#8A8074">善人：不见</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">再降一格</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">有恆：可见</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">落在低处</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是妥协，是知道什么最难得</text></svg>