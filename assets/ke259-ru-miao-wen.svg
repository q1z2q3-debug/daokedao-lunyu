<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="入问礼三层">  <rect x="20" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="70" y="88" text-anchor="middle" font-size="12" fill="#8A8074">入：其身</text>  <text x="70" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">入庙</text>  <rect x="170" y="56" width="100" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">问：其实</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">每事</text>  <rect x="320" y="56" width="100" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="370" y="88" text-anchor="middle" font-size="12" fill="#A2503B">礼：其心</text>  <text x="370" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">是礼也</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">问本身，就是礼</text></svg>
