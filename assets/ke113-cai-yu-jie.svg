<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="归与、狂简、斐然成章、不知裁四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">歸與</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">心已归</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">狂簡</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">志大略事</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">斐然成章</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">才已成篇</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不知裁</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">无节可守</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">许其才，忧其无节：成章之后，还差一刀</text></svg>
