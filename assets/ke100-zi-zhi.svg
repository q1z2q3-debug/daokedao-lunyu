<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="自知与虚让虚夸两栏，左实右虚">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">自知其分</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说清差处</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#8A8074">虚让或虚夸</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">两皆失实</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不自夸，亦不相谀：两端都不取</text></svg>
