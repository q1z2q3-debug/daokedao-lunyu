<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="喻、行、分三段递进，末为分">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">喻</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">心先透亮</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">行</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">随之而往</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">分</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">两种人</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">判准前移一步：从「做」移到「懂」</text></svg>
