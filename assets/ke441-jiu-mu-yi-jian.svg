<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">視聽</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其入</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">色貌</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其见</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">言事</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其出</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">疑忿得</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其变</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">前六常，后三变，义为之断</text></svg>