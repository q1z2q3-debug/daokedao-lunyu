<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="含糊与说清两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">含糊拖着</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">最伤人</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">说清界线</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">彼此都知道</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">辞一次是客气，再逼就是走</text></svg>
