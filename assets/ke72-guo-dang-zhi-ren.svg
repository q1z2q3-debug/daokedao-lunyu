<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="过、党、知仁三段递进，末为量">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">过 · 可见之失</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">人心所偏</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">党 · 各归其类</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">厚薄分途</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">知仁 · 量其斤两</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">由偏推正</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">拿过失当尺，量的是心，不是罪</text></svg>
