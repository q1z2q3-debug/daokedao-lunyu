<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="成见、一步、许进、不究四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">互鄉：成见</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">地</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">童子見：一步</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">人</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">與其進：许</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">往前看</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不保其往：不究</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不翻账</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">前不究，后不保，只管眼前这一步</text></svg>