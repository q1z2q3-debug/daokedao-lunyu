<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="三阶段加一断">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">苗：始生</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一步</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">秀：吐华</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">二步</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">实：成谷</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">三步</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">缺一步：白种</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不成</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">承认这样的事真有，才谈得上自勉</text></svg>
