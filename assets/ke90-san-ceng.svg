<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="德、不孤、必有邻三段递进，末为果">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">德</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">一人所守</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">不孤</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">德之性</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">必有鄰</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">德之果</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">八字三层：把个人之德与人间的聚连成一条</text></svg>
