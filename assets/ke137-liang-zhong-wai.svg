<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="野与史两栏">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">野：质压文</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">粗砺</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#8A8074">史：文压质</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">浮饰</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两个「胜」字才是病：不是哪一样不好，是哪一样太盛</text></svg>
