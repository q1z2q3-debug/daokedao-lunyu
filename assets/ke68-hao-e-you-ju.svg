<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="好与恶两端并列，各标其据">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">好 · 有所据</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">称许之，非顺我意</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">恶 · 有所止</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">憎恶之，非碍我事</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两端都要有据：好不滥，恶不私</text></svg>
