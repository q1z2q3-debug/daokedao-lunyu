<text x="215" y="262" font-size="10.5" fill="#4A5C55">实心 34 / 60</text>

<line x1="20" y1="292" x2="356" y2="292" stroke="#DCCBB0" stroke-width="1"/>
<text x="190" y="330" font-size="19" fill="#2F2A24" text-anchor="middle">鲜 ≠ 无</text>
<text x="190" y="356" font-size="11.5" fill="#6E6459" text-anchor="middle">若说「无仁」，是判死；说「鲜」，是留门。</text>
<text x="190" y="382" font-size="11" fill="#2F2A24" text-anchor="middle">改法不在抹掉实心，在刮去空心的那一层。</text>
<text x="190" y="410" font-size="10.5" fill="#8A8074" text-anchor="middle">示意图：点阵为心田之喻，非计量模型。</text>
