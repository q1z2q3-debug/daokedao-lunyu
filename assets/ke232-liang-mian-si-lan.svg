<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="两面四栏加一收">  <rect x="15" y="56" width="78" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="54" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">法语：正</text>  <text x="54" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">从</text>  <rect x="120" y="56" width="78" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="159" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">改：里</text>  <text x="159" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">贵</text>  <rect x="225" y="56" width="78" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="264" y="88" text-anchor="middle" font-size="12" fill="#A2503B">巽与：婉</text>  <text x="264" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说</text>  <rect x="330" y="56" width="78" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="369" y="88" text-anchor="middle" font-size="12" fill="#8A8074">绎：里</text>  <text x="369" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">贵</text>  <rect x="15" y="56" width="168" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="99" y="88" text-anchor="middle" font-size="12" fill="#A2503B">从而不改</text>  <text x="99" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">面从</text>  <rect x="225" y="56" width="168" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="309" y="88" text-anchor="middle" font-size="12" fill="#8A8074">末如之何</text>  <text x="309" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">绝境</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">能从不改，等于没听</text></svg>
