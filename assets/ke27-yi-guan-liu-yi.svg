<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-label="一贯与六艺：中心一贯，外围礼乐射御书数六器" style="max-width:520px">
    <text x="200" y="36" text-anchor="middle" font-size="10" fill="#8A8074">非特为一才一艺</text>
    <line x1="200" y1="146" x2="200" y2="68" stroke="#D8CBB4" stroke-width="1"/>
    <line x1="200" y1="146" x2="287" y2="107" stroke="#D8CBB4" stroke-width="1"/>
    <line x1="200" y1="146" x2="287" y2="185" stroke="#D8CBB4" stroke-width="1"/>
    <line x1="200" y1="146" x2="200" y2="224" stroke="#D8CBB4" stroke-width="1"/>
    <line x1="200" y1="146" x2="113" y2="185" stroke="#D8CBB4" stroke-width="1"/>
    <line x1="200" y1="146" x2="113" y2="107" stroke="#D8CBB4" stroke-width="1"/>
    <circle cx="200" cy="146" r="30" fill="#FCF8EF" stroke="#A8763E" stroke-width="1.6"/>
    <text x="200" y="143" text-anchor="middle" font-size="13" fill="#8C5E2A">一贯</text>
    <text x="200" y="160" text-anchor="middle" font-size="8" fill="#A8763E">体无不具</text>
    <circle cx="200" cy="68" r="16" fill="#fff" stroke="#C9BEAE" stroke-width="1"/><text x="200" y="74" text-anchor="middle" font-size="11" fill="#3A342B">礼</text>
    <circle cx="287" cy="107" r="16" fill="#fff" stroke="#C9BEAE" stroke-width="1"/><text x="287" y="113" text-anchor="middle" font-size="11" fill="#3A342B">乐</text>
    <circle cx="287" cy="185" r="16" fill="#fff" stroke="#C9BEAE" stroke-width="1"/><text x="287" y="191" text-anchor="middle" font-size="11" fill="#3A342B">射</text>
    <circle cx="200" cy="224" r="16" fill="#fff" stroke="#C9BEAE" stroke-width="1"/><text x="200" y="230" text-anchor="middle" font-size="11" fill="#3A342B">御</text>
    <circle cx="113" cy="185" r="16" fill="#fff" stroke="#C9BEAE" stroke-width="1"/><text x="113" y="191" text-anchor="middle" font-size="11" fill="#3A342B">书</text>
    <circle cx="113" cy="107" r="16" fill="#fff" stroke="#C9BEAE" stroke-width="1"/><text x="113" y="113" text-anchor="middle" font-size="11" fill="#3A342B">数</text>
    <text x="200" y="262" text-anchor="middle" font-size="11" fill="#5F564A">六样各是一器，中间那根线才叫不器</text>
  </svg>
