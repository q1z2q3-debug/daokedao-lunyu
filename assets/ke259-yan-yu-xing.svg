<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="有言与有行两栏"> <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">3.15：有议论</text> <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">或人疑之，子曰是禮</text> <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">10.21：只有动作</text> <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">入大廟，每事問</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">乡党记行，不记言</text></svg>
