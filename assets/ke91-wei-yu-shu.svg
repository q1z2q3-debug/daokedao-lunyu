<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="几谏与数两栏对照，左通右塞">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">幾諫 · 微</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说得轻，留退路</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">數 · 频</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说得密，堵退路</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">同一份心，微与数的差别在密度</text></svg>
