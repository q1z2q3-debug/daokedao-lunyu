<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="记、言、因、果四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">牢曰</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">弟子所记</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">子云</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">夫子自言</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不试：因</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不为世用</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">故艺：果</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">习而通之</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两层引语套着：因是闲，果是多能</text></svg>
