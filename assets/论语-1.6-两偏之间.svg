<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="文灭其质与质胜而野：两种偏" font-family="'Noto Serif SC','Songti SC',serif">
<text x="20" y="26" font-size="11" fill="#A2503B" font-family="'Noto Sans SC',sans-serif" letter-spacing="3">义 理 图 二</text>
<text x="20" y="58" font-size="21" fill="#2F2A24">两偏之间</text>
<text x="20" y="78" font-size="12" fill="#6E6459">一个太早，一个太晚；中间是「有余力」。</text>

<rect x="20" y="96" width="162" height="182" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="34" y="120" font-size="12" fill="#A2503B">先文后行</text>
<text x="34" y="150" font-size="11" fill="#2F2A24">文灭其质</text>
<text x="34" y="176" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">会说不会做</text>
<text x="34" y="200" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">话漂亮，人没长起来</text>
<text x="34" y="232" font-size="10.5" fill="#A2503B" font-family="'Noto Sans SC',sans-serif">即 1.3 之「饰」</text>
<text x="34" y="258" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">早一步，成了浮华</text>

<rect x="198" y="96" width="162" height="182" fill="#F8F3E6" stroke="#CDB99C"/>
<text x="212" y="120" font-size="12" fill="#4A5C55">先行无文</text>
<text x="212" y="150" font-size="11" fill="#2F2A24">质胜而野</text>
<text x="212" y="176" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">会做说不出</text>
<text x="212" y="200" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">无成法可考，无所以然</text>
<text x="212" y="232" font-size="10.5" fill="#4A5C55" font-family="'Noto Sans SC',sans-serif">止于自己的边界</text>
<text x="212" y="258" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">晚一步，成了粗野</text>

<line x1="20" y1="312" x2="360" y2="312" stroke="#DCCBB0" stroke-width="1"/>
<text x="20" y="336" font-size="11.5" fill="#2F2A24">行有余力，则以学文。</text>
<text x="20" y="360" font-size="10.5" fill="#6E6459" font-family="'Noto Sans SC',sans-serif">先做六件，再读第七件；两偏都不落。</text>
<text x="20" y="384" font-size="10.5" fill="#8A8074" font-family="'Noto Sans SC',sans-serif">「有余力」是闸门，不是墙：拦早不拦晚。</text>
</svg>
