<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">栖栖</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">奔走不休</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">佞</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">口舌取容</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">非敢</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">谦而不争</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">疾固</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">痛恨固陋</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">形可诬，志不可诬</text></svg>