<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="可逝、不可陷、可欺、不可罔四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">可逝</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">身可往</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不可陷</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">身不投</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">可欺</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">心可以理动</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不可罔</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">心不被无理压</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两个「可」、两个「不可」：一句管身，一句管心</text></svg>
