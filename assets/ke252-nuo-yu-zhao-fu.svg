<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="事服位身四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">事：非常</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">乡人驱疫</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">服：非常</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">朝服玄冠</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">位：不移</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">立于阼阶</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">身：不动</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">只是站着</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">全章的力，都在「不动」上</text></svg>