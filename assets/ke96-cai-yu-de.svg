<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="仁、佞、屡憎三段，末为后果">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">仁</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">德：不轻许</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">佞</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">口：捷给</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">屢憎</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">快嘴挡人，人厌</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">世人以能说为才，孔子偏说「焉用」</text></svg>
