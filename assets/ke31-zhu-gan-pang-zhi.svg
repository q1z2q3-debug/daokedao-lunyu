<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="290" role="img" aria-label="主干与旁枝：正学有统为主干，异端为旁枝，专治旁枝者越走越远" style="max-width:520px">
<defs><marker id="a31a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#8A8074"/></marker></defs>
<text x="220" y="26" text-anchor="middle" font-size="11" fill="#3A342B">正学有统，异端为枝</text>
<path d="M210 48 L210 244" stroke="#A8763E" stroke-width="2.2" fill="none"/>
<circle cx="210" cy="48" r="3.2" fill="#A8763E"/>
<circle cx="210" cy="244" r="3.2" fill="#A8763E"/>
<text x="222" y="66" font-size="10" fill="#8C5E2A">正学 · 有统</text>
<text x="222" y="238" font-size="9" fill="#8A8074">一以贯之</text>
<path d="M210 118 C248 128, 276 144, 306 164" stroke="#8A8074" stroke-width="1.3" fill="none" marker-end="url(#a31a)"/>
<path d="M210 176 C172 190, 144 206, 116 228" stroke="#8A8074" stroke-width="1.3" fill="none" marker-end="url(#a31a)"/>
<circle cx="312" cy="168" r="3.4" fill="#A2503B"/>
<text x="326" y="164" font-size="10" fill="#A2503B">异端</text>
<text x="326" y="178" font-size="8.5" fill="#8A8074">可观，不可专</text>
<circle cx="110" cy="232" r="3.4" fill="#A2503B"/>
<text x="76" y="252" font-size="10" fill="#A2503B">异端</text>
<text x="322" y="200" font-size="8.5" fill="#6E665A">专治者离干最远</text>
<text x="220" y="278" text-anchor="middle" font-size="10.5" fill="#5F564A">枝可观，不可专治：专治则离干愈远，无所归</text>
</svg>
