<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="因果本四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">果：片言折狱</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">人信其言</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">指：其由也與</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">子路</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">因：无宿诺</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">诺不隔夜</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">本：信</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">攒而成</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">一句赞其能，一句释其因</text></svg>