<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="两偏一问一抹四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#A2503B">师：過</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">越线而过</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">商：不及</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">线前未进</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#8A8074">子贡：师愈</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">以为过胜</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">孔子：过犹不及</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">两头皆偏</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不答谁更好，只答问错了</text></svg>