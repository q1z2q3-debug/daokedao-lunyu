<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="巧言、令色、足恭、匿怨四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">巧言</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">口：好听</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">令色</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">面：好看</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">足恭</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">身：过低</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">匿怨</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">心：藏恨</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">前三样做在身上，第四样藏在心里：假到了底</text></svg>
