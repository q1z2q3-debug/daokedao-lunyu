<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="非不说、力不足、中道而废、今女画四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">非不說</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">认其心</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">力不足</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">认其力</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">中道而廢</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">真不够：半路停</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">今女畫</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">自画限：没走停</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两种停：一种真不够，一种自己画线</text></svg>
