<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="道善与道不善两栏对照，左守右改">  <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="115" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">道善，守之</text>  <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">三年不改</text>  <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="325" y="88" text-anchor="middle" font-size="12" fill="#A2503B">道不善，当改</text>  <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">改之亦孝</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">「道」字一立，这一章就不是盲守</text></svg>
