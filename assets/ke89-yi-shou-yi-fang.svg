<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="讷、敏、欲三段递进，末为取向">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">訥於言</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">收：不轻说</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">敏於行</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">放：不拖事</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">欲</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">力气的去向</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是能力问题，是取向问题：想往哪儿用力</text></svg>
