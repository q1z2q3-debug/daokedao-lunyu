<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="两栏"> <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="115" y="88" text-anchor="middle" font-size="12" fill="#8A8074">匹夫匹婦之諒</text> <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">死于沟渎，莫之知</text> <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="325" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">一匡天下</text> <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">生而民受赐</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">死而无益与死而后已</text></svg>