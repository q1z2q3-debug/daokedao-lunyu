<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="先后三格">  <rect x="20" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="70" y="88" text-anchor="middle" font-size="12" fill="#8A8074">未出：不敢先</text>  <text x="70" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">等</text>  <rect x="170" y="56" width="100" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">既出：不敢后</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">随</text>  <rect x="320" y="56" width="100" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="370" y="88" text-anchor="middle" font-size="12" fill="#A2503B">两个不敢</text>  <text x="370" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">护一人</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两个「不敢」方向相反，护的是同一个人</text></svg>
