<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 958" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="认知之圆：六种情形与君子虚线界" font-family="'Noto Serif SC','Songti SC',serif">
<defs>
<marker id="kk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6E6459"/></marker>
</defs>

<text x="20" y="28" font-size="11" fill="#A2503B" font-family="'Noto Sans SC',sans-serif" letter-spacing="3">认 知 之 圆</text>
<text x="20" y="60" font-size="21" fill="#2F2A24">人不知，两端</text>
<text x="20" y="82" font-size="10.5" fill="#6E6459">青＝我　赭＝彼　实线＝界封闭　虚线＝界可移</text>

<!-- A 我大彼小 -->
<rect x="20" y="98" width="340" height="106" fill="none" stroke="#E6D8C2"/>
<circle cx="82" cy="150" r="38" fill="none" stroke="#4A5C55" stroke-width="1.6"/>
<circle cx="98" cy="150" r="13" fill="none" stroke="#A2503B" stroke-width="1.4"/>
<text x="70" y="155" font-size="11" fill="#4A5C55">我</text>
<text x="160" y="126" font-size="12" fill="#2F2A24">一　我大彼小：人不知我</text>
<text x="160" y="148" font-size="10.5" fill="#6E6459">我的圆超出他的界，讲了他接不住。</text>
<text x="160" y="168" font-size="10.5" fill="#6E6459">解法：缩到他的圆内说——降维，非降格。</text>
<text x="160" y="188" font-size="10" fill="#A2503B">我讲他不懂</text>

<!-- B 我小彼大 -->
<rect x="20" y="212" width="340" height="106" fill="none" stroke="#E6D8C2"/>
<circle cx="72" cy="264" r="13" fill="none" stroke="#4A5C55" stroke-width="1.4"/>
<circle cx="88" cy="264" r="38" fill="none" stroke="#A2503B" stroke-width="1.6"/>
<text x="80" y="269" font-size="11" fill="#A2503B">彼</text>
<text x="160" y="240" font-size="12" fill="#2F2A24">二　我小彼大：我不知人</text>
<text x="160" y="262" font-size="10.5" fill="#6E6459">他的圆超出我的界，听了不解其意。</text>
<text x="160" y="282" font-size="10.5" fill="#6E6459">解法：先认「我未及」，再问其指。</text>
<text x="160" y="302" font-size="10" fill="#4A5C55">他讲我不懂</text>

<!-- C 相交 -->
<rect x="20" y="326" width="340" height="106" fill="none" stroke="#E6D8C2"/>
<circle cx="72" cy="378" r="26" fill="none" stroke="#4A5C55" stroke-width="1.6"/>
<circle cx="108" cy="378" r="26" fill="none" stroke="#A2503B" stroke-width="1.6"/>
<text x="56" y="383" font-size="10" fill="#4A5C55">我</text>
<text x="112" y="383" font-size="10" fill="#A2503B">彼</text>
<text x="160" y="354" font-size="12" fill="#2F2A24">三　相交：互证</text>
<text x="160" y="376" font-size="10.5" fill="#6E6459">交集是共识，两处差集是彼此盲区。</text>
<text x="160" y="396" font-size="10.5" fill="#6E6459">他详我略处，正是可学处。</text>
<text x="160" y="416" font-size="10" fill="#8A7A66">有朋远来，即此格</text>

<!-- D 相离 -->
<rect x="20" y="440" width="340" height="106" fill="none" stroke="#E6D8C2"/>
<circle cx="56" cy="492" r="22" fill="none" stroke="#4A5C55" stroke-width="1.6"/>
<circle cx="122" cy="492" r="22" fill="none" stroke="#A2503B" stroke-width="1.6"/>
<text x="44" y="497" font-size="10" fill="#4A5C55">我</text>
<text x="120" y="497" font-size="10" fill="#A2503B">彼</text>
<text x="160" y="468" font-size="12" fill="#2F2A24">四　相离：无公共语言</text>
<text x="160" y="490" font-size="10.5" fill="#6E6459">两圆各在对方之外，说什么都落在空处。</text>
<text x="160" y="510" font-size="10.5" fill="#6E6459">先造交集：共事、共读、借喻。</text>
<text x="160" y="530" font-size="10" fill="#A2503B">最费口舌，最须耐心</text>

<!-- E 重合 -->
<rect x="20" y="554" width="340" height="106" fill="none" stroke="#E6D8C2"/>
<circle cx="84" cy="606" r="28" fill="none" stroke="#4A5C55" stroke-width="1.6"/>
<circle cx="84" cy="606" r="21" fill="none" stroke="#A2503B" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="84" y="611" font-size="9.5" fill="#6E6459" text-anchor="middle">我 · 彼</text>
<text x="160" y="582" font-size="12" fill="#2F2A24">五　重合：回声</text>
<text x="160" y="604" font-size="10.5" fill="#6E6459">完全相同，只证不改，学无所得。</text>
<text x="160" y="624" font-size="10.5" fill="#6E6459">要的不是同，是同中之异。</text>
<text x="160" y="644" font-size="10" fill="#8A7A66">同门太久，亦成此格</text>

<!-- F 虚线界 -->
<rect x="20" y="668" width="340" height="118" fill="#F8F3E6" stroke="#A2503B"/>
<circle cx="84" cy="726" r="34" fill="none" stroke="#4A5C55" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="84" cy="726" r="46" fill="none" stroke="#A2503B" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
<circle cx="98" cy="742" r="12" fill="none" stroke="#A2503B" stroke-width="1.3"/>
<line x1="122" y1="700" x2="136" y2="686" stroke="#6E6459" stroke-width="1.2" marker-end="url(#kk)"/>
<text x="160" y="696" font-size="12" fill="#2F2A24">六　虚线圆：君子</text>
<text x="160" y="718" font-size="10.5" fill="#6E6459">界可移：能容大圆，能扩小圆，</text>
<text x="160" y="736" font-size="10.5" fill="#6E6459">能降维讲，能升维听。</text>
<text x="160" y="756" font-size="10.5" fill="#6E6459">不是认知无边，是边界不锁死。</text>
<text x="160" y="776" font-size="10" fill="#A2503B">不受认知限制，非无限制</text>

<line x1="20" y1="812" x2="360" y2="812" stroke="#DCCBB0" stroke-width="1.1"/>
<text x="20" y="838" font-size="11" fill="#2F2A24">人不知有两端：我讲他不懂（我的圆超出他）；</text>
<text x="20" y="862" font-size="11" fill="#2F2A24">他讲我不懂（他的圆超出我）。</text>
<text x="20" y="886" font-size="11" fill="#2F2A24">圆之大小只分远近，界之虚实才分君子。</text>
<text x="20" y="910" font-size="11" fill="#6E6459">实线：封闭——不学、不降维、不认未及。</text>
<text x="20" y="934" font-size="11" fill="#6E6459">虚线：可移——遇大则扩，遇小则容，遇异则问。</text>
</svg>
