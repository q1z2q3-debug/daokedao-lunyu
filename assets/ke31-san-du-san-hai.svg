<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="460" height="270" role="img" aria-label="三种读法三样害：专治、攻伐、放任，正解在有统而容异" style="max-width:520px">
<text x="230" y="26" text-anchor="middle" font-size="11" fill="#3A342B">一句三读，三样害</text>
<rect x="28" y="46" width="108" height="132" fill="#FFFDF6" stroke="#DED2B9" stroke-width="1"/>
<text x="82" y="70" text-anchor="middle" font-size="12.5" fill="#8C5E2A">专 治</text>
<text x="82" y="88" text-anchor="middle" font-size="9" fill="#8A8074">攻，治也</text>
<text x="82" y="116" text-anchor="middle" font-size="9.5" fill="#5C5347">专治一端</text>
<text x="82" y="132" text-anchor="middle" font-size="9.5" fill="#5C5347">而力求其精</text>
<text x="82" y="160" text-anchor="middle" font-size="9" fill="#A2503B">离统，愈精愈偏</text>
<rect x="176" y="46" width="108" height="132" fill="#FFFDF6" stroke="#DED2B9" stroke-width="1"/>
<text x="230" y="70" text-anchor="middle" font-size="12.5" fill="#8C5E2A">攻 伐</text>
<text x="230" y="88" text-anchor="middle" font-size="9" fill="#8A8074">攻，击也</text>
<text x="230" y="116" text-anchor="middle" font-size="9.5" fill="#5C5347">以言击人</text>
<text x="230" y="132" text-anchor="middle" font-size="9.5" fill="#5C5347">以势排异</text>
<text x="230" y="160" text-anchor="middle" font-size="9" fill="#A2503B">伤异己，亦伤己</text>
<rect x="324" y="46" width="108" height="132" fill="#FFFDF6" stroke="#DED2B9" stroke-width="1"/>
<text x="378" y="70" text-anchor="middle" font-size="12.5" fill="#8C5E2A">放 任</text>
<text x="378" y="88" text-anchor="middle" font-size="9" fill="#8A8074">不辨一端</text>
<text x="378" y="116" text-anchor="middle" font-size="9.5" fill="#5C5347">什么都收</text>
<text x="378" y="132" text-anchor="middle" font-size="9.5" fill="#5C5347">无所归宿</text>
<text x="378" y="160" text-anchor="middle" font-size="9" fill="#A2503B">杂而无统，成罔</text>
<rect x="28" y="196" width="404" height="46" fill="#F6F1E3" stroke="#C58A73" stroke-width="1"/>
<text x="230" y="216" text-anchor="middle" font-size="10.5" fill="#2F2A24">正解：有统而容异</text>
<text x="230" y="232" text-anchor="middle" font-size="9" fill="#6E665A">先立其一端，再观其余端；观而不专，专而不离</text>
</svg>
