<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="器、何器、瑚琏三段，末为贵而不通">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">女，器也</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">许：有用</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#8A8074">何器</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">追问：欲知其品</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">瑚璉</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">贵而不通</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">好话是要问出来的：先给器，再给瑚琏</text></svg>
