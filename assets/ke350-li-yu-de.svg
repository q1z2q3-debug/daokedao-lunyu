<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="四段"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">羿：善射</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">以力闻</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">奡：盪舟</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">以力闻</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">禹稷：躬稼</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">最朴最劳</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">有天下</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">德之载</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两组对观</text></svg>