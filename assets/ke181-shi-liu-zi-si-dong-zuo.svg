<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="听、请、等、应四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">歌而善：听出</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其人之长</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">使反之：请</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">使其尽</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">而後：等</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不抢先</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">和之：应</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">己随后</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">妙在「必」与「而后」：每遇皆然，绝不抢先</text></svg>