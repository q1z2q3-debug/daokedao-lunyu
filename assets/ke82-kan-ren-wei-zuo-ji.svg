<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="见、思省、成己三段递进，末为成己">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">见</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">向外看人</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">思齐 / 自省</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">两向用力</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">成己</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不是成人之短</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">看人是为了做己，不是为了判人</text></svg>
