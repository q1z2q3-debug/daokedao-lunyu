<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="有疾、自牖执手、亡之命矣、斯人斯疾四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">有疾</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其事</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">自牖執手</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">分寸与不舍</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">亡之命矣</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其叹</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">斯人斯疾</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说两遍</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不进室是分寸，执其手是不舍：两者同时做到</text></svg>
