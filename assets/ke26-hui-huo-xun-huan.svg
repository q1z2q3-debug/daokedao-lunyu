<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-label="回火示意：故经温而寻绎出新，新回注故，一圈比一圈高" style="max-width:520px">
    <defs><marker id="a26a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#8A8074"/></marker></defs>
    <path d="M118 140 Q200 78 282 140" fill="none" stroke="#8A8074" stroke-width="1.6" marker-end="url(#a26a)"/>
    <path d="M282 164 Q200 226 118 164" fill="none" stroke="#8A8074" stroke-width="1.6" marker-end="url(#a26a)"/>
    <text x="200" y="94" text-anchor="middle" font-size="10.5" fill="#5F564A">寻绎：从旧里找缝、换问、连线</text>
    <text x="200" y="212" text-anchor="middle" font-size="10.5" fill="#5F564A">回注：新解改写旧的读法</text>
    <circle cx="92" cy="152" r="26" fill="#FCF8EF" stroke="#C9BEAE" stroke-width="1.2"/>
    <text x="92" y="151" text-anchor="middle" font-size="15" fill="#3A342B">故</text>
    <text x="92" y="167" text-anchor="middle" font-size="8.5" fill="#8A8074">旧所闻</text>
    <circle cx="308" cy="152" r="26" fill="#FCF8EF" stroke="#C9BEAE" stroke-width="1.2"/>
    <text x="308" y="151" text-anchor="middle" font-size="15" fill="#3A342B">新</text>
    <text x="308" y="167" text-anchor="middle" font-size="8.5" fill="#8A8074">所得于今</text>
    <circle cx="200" cy="152" r="40" fill="#fff" stroke="#A8763E" stroke-width="1.6"/>
    <text x="200" y="150" text-anchor="middle" font-size="16" fill="#8C5E2A">温</text>
    <text x="200" y="169" text-anchor="middle" font-size="9" fill="#8C5E2A">寻绎 · 回火</text>
    <text x="200" y="252" text-anchor="middle" font-size="11" fill="#5F564A">温故不是回头看，是把旧的火重新点着</text>
  </svg>
