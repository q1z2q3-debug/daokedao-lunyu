<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="过与不及两栏"> <rect x="40" y="56" width="150" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="115" y="88" text-anchor="middle" font-size="12" fill="#A2503B">過：用力太猛</text> <text x="115" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">越而过之</text> <rect x="250" y="56" width="150" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="325" y="88" text-anchor="middle" font-size="12" fill="#8A8074">不及：用力不足</text> <text x="325" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">未至而止</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">两头都不是中，中者最难</text></svg>