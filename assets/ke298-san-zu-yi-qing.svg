<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="三样减二剩一"> <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">三样：食兵信</text> <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">立国之具</text> <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="166" y="88" text-anchor="middle" font-size="12" fill="#8A8074">去兵</text> <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">爪牙可去</text> <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/> <text x="271" y="88" text-anchor="middle" font-size="12" fill="#A2503B">去食</text> <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">民天亦可去</text> <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="376" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">信不可去</text> <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">无信则不立</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">递减之法，一层比一层狠</text></svg>