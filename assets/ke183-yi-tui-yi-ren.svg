<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="推、认、抑、抬四段">  <rect x="15" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="61" y="88" text-anchor="middle" font-size="12" fill="#8A8074">聖與仁：推</text>  <text x="61" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">大名</text>  <rect x="120" y="56" width="92" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">不厭不倦：认</text>  <text x="166" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">小事</text>  <rect x="225" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="271" y="88" text-anchor="middle" font-size="12" fill="#8A8074">云爾已矣：抑</text>  <text x="271" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">说得轻</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#A2503B">不能學：抬</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">其实重</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">弟子学不来的，恰恰是这两件「轻」事</text></svg>