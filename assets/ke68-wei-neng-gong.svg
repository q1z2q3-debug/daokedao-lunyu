<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="唯、能、公三段递进，末为公尺">  <rect x="30" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#8A8074">唯 · 独</text>  <text x="90" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">非人人可</text>  <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">能 · 力与分</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">落在对的人身上</text>  <rect x="290" y="56" width="120" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#A2503B">公 · 尺</text>  <text x="350" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">不由己便</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">不是不许好恶，是好恶不归自己管</text></svg>
