<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="四变四格">  <rect x="15" y="56" width="95" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="62" y="88" text-anchor="middle" font-size="12" fill="#8A8074">见人：变</text>  <text x="62" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">齐衰·冕·瞽</text>  <rect x="125" y="56" width="95" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="172" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">在车：式</text>  <text x="172" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">凶服·负版</text>  <rect x="235" y="56" width="95" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="282" y="88" text-anchor="middle" font-size="12" fill="#A2503B">受：变色</text>  <text x="282" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">盛馔</text>  <rect x="330" y="56" width="92" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="376" y="88" text-anchor="middle" font-size="12" fill="#8A8074">天：必变</text>  <text x="376" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">迅雷风烈</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">变的是色，守的是敬</text></svg>
