<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="斋之三层"> <rect x="40" y="56" width="120" height="86" fill="#FFFDF6" stroke="#8A8074"/> <text x="100" y="88" text-anchor="middle" font-size="12" fill="#8A8074">齊</text> <text x="100" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">将祭而洁</text> <rect x="160" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">明衣</text> <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">外洁</text> <rect x="280" y="56" width="120" height="86" fill="#FFFDF6" stroke="#4A5C55"/> <text x="340" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">布</text> <text x="340" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">质而不华</text> <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">洁而不质则为饰</text></svg>