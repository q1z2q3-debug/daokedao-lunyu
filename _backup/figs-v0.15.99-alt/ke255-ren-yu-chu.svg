<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="事先后三层">  <rect x="20" y="56" width="100" height="86" fill="#FFFDF6" stroke="#8A8074"/>  <text x="70" y="88" text-anchor="middle" font-size="12" fill="#8A8074">事：廄焚</text>  <text x="70" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">火起</text>  <rect x="170" y="56" width="100" height="86" fill="#FFFDF6" stroke="#4A5C55"/>  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#4A5C55">先：問人</text>  <text x="220" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">傷人乎</text>  <rect x="320" y="56" width="100" height="86" fill="#FFFDF6" stroke="#A2503B"/>  <text x="370" y="88" text-anchor="middle" font-size="12" fill="#A2503B">後：不問馬</text>  <text x="370" y="112" text-anchor="middle" font-size="9.5" fill="#8A8074">记者之笔</text>  <text x="220" y="182" text-anchor="middle" font-size="10.5" fill="#2F2A24">力量不在「问人」，在「不问马」</text></svg>
